A) Une petite annonce
B) Un programme télévisé
C) Un article neutre sans opinion
D) Un article qui exprime la position de la rédaction ou de la direction du journal
R: D
E: Il est généralement signé par le directeur ou le rédacteur en chef.

Q: Qu’est-ce qu’une enquête journalistique ?
A) Un article de quelques lignes
B) Un dessin humoristique
C) Un sondage d’opinion réalisé en une heure
D) Un travail d’investigation approfondi pour révéler ou expliquer des faits
R: D
E: Elle demande du temps, de nombreuses sources et des vérifications.

Q: Comment s’appelle l’agence de presse nationale du Sénégal ?
A) L’Agence France-Presse (AFP)
B) L’Agence de presse sénégalaise (APS)
C) La RTS
D) Reuters
R: B
E: La RTS est la radiotélévision publique, l’AFP une agence française.

Q: Que signifie recouper une information ?
A) La publier sur plusieurs réseaux sociaux
B) La traduire dans une autre langue
C) La confirmer auprès de plusieurs sources indépendantes avant de la publier
D) La raccourcir pour qu’elle tienne dans la page
R: C
E: Le recoupement est une règle de base pour éviter les erreurs.

Q: Que signifie une information donnée « off » (off the record) ?
A) Le journaliste peut s’en servir pour comprendre, mais ne doit pas la citer ni l’attribuer à sa source
B) Elle est fausse
C) Elle est réservée à la radio
D) Elle doit être publiée immédiatement avec le nom de la source
R: A
E: Respecter le « off » est une question de confiance avec les sources.

Q: Qu’est-ce que la Charte de Munich (1971) ?
A) La loi qui crée les radios privées
B) Une déclaration des devoirs et des droits des journalistes
C) Un traité de paix européen
D) Un accord commercial entre agences de presse
R: B
E: Elle sert de référence déontologique dans de nombreux pays.

Q: Qu’est-ce qu’une fake news (infox) ?
A) Une information publiée à la radio
B) Une information récente
C) Une fausse information présentée comme vraie
D) Une information traduite
R: C
E: Elle circule souvent très vite sur les réseaux sociaux.

Q: Qu’est-ce que le fact-checking ?
A) La vérification des faits et des déclarations publiques
B) La vente d’espaces publicitaires
C) La rédaction des titres
D) La mise en page d’un journal
R: A
E: Des rédactions y consacrent des rubriques entières.

Q: Que désigne la ligne éditoriale d’un média ?
A) L’ensemble des choix et des orientations qui guident ce qu’il publie
B) La signature du journaliste
C) Le nombre de lignes par article
D) La ligne de bus qui passe devant la rédaction
R: A
E: Elle détermine les sujets traités, le ton et les angles.

Q: Quel est le rôle du rédacteur en chef ?
A) Gérer uniquement la publicité
B) Imprimer le journal
C) Vendre le journal dans la rue
D) Diriger la rédaction et décider des contenus publiés
R: D
E: Il organise le travail des journalistes et arbitre les choix éditoriaux.

Q: Qu’est-ce qu’un billet d’humeur ?
A) Un article scientifique
B) Un ticket de transport
C) Un communiqué officiel
D) Un texte court et personnel, souvent ironique, sur un fait d’actualité
R: D
E: C’est un genre d’opinion, comme l’éditorial ou la chronique.

Q: Qu’est-ce qu’un portrait journalistique ?
A) Une photo d’identité
B) Un article qui fait découvrir une personne, sa personnalité et son parcours
C) La liste des journalistes d’une rédaction
D) Un tableau de chiffres
R: B
E: Il mêle faits, anecdotes et citations.

Q: Que garantit le droit de réponse ?
A) Le lecteur peut exiger le remboursement du journal
B) Le journaliste peut répondre à toutes les questions
C) Une personne mise en cause dans un média peut faire publier sa réponse dans ce même média
D) Le média peut refuser toute critique
R: C
E: Il protège les personnes citées dans la presse.

Q: Que signifie une information sous embargo ?
A) Elle ne doit pas être publiée avant une date et une heure fixées
B) Elle vient d’un pays étranger
C) Elle a déjà été publiée ailleurs
D) Elle est interdite pour toujours
R: A
E: Les rapports officiels sont souvent transmis aux journalistes sous embargo.`},
{id:"mad-hist",school:"madiba",name:"Histoire politique de l’Afrique contemporaine",cat:"Histoire politique",txt:`Q: Qu’a organisé la conférence de Berlin (1884-1885) ?
A) La fin de l’esclavage aux États-Unis
B) L’indépendance des pays africains
C) Les règles du partage de l’Afrique entre puissances européennes
D) La création de l’Union africaine
R: C
E: Elle a fixé les règles de la conquête coloniale en Afrique.

Q: Quelle ville est devenue la capitale de l’Afrique-Occidentale française (AOF) en 1902 ?
A) Abidjan
B) Saint-Louis
C) Dakar
D) Bamako
R: C
E: Saint-Louis était auparavant le siège du gouvernement général.

Q: Qui a été le premier président de la République du Sénégal ?
A) Abdou Diouf
B) Mamadou Dia
C) Léopold Sédar Senghor
D) Lamine Guèye
R: C
E: Il a présidé le pays de 1960 à 1980.

Q: Qui a succédé à Léopold Sédar Senghor à la présidence du Sénégal en 1981 ?
A) Mamadou Dia
B) Abdou Diouf
C) Macky Sall
D) Abdoulaye Wade
R: B
E: Senghor a démissionné fin 1980. Abdou Diouf, alors Premier ministre, lui a succédé.

info:function(){return "<button class='back' onclick='go(\"home\")'>← Retour</button><h1>Guide</h1><p class='mu'>Tout ce qu’il faut savoir pour bien utiliser l’appli.</p>"
+"<div class='cd'><b>À quoi ça sert</b><p>L’appli est vide au départ : tu y mets tes propres questions ou exercices, elle te fait réviser et te note. Rien n’est envoyé sur Internet.</p></div>"
+"<div class='cd'><b>Pour démarrer</b><p>1. Ouvre « Comment faire » et copie le prompt. 2. Colle-le dans une IA avec ton cours. 3. Importe le résultat (texte collé ou PDF). 4. Touche « Lancer ».</p></div>"
+"<div class='cd b'><b>⚠️ Tes séries peuvent disparaître</b><p>Elles sont gardées dans le navigateur de cet appareil, pas en ligne. Elles disparaissent si tu vides les données du navigateur ou si tu utilises la navigation privée, et elles ne passent pas d’un téléphone ou d’un navigateur à l’autre. Pour en garder une copie : « Exporter », « Copier la série », puis garde le texte dans un fichier ou dans un message WhatsApp à toi-même.</p></div>"
+"<div class='cd'><b>Activation et essai gratuit</b><p>À la première ouverture, tu as 48 heures d’essai gratuit complet. Ensuite, un code d’activation est nécessaire. Reculer l’heure du téléphone pendant l’essai bloque l’appli : seul un code d’activation la débloque. Une fois l’appli activée, plus aucune vérification de l’heure n’est faite.</p><p>Le code d’activation ne marche que sur l’appareil pour lequel il a été généré. Si tu vides les données du navigateur ou si tu changes de téléphone, demande un nouveau code.</p></div>"
+"<div class='cd'><b>Partager une série</b><p>« Exporter », « Copier la série », puis envoie le texte (par WhatsApp par exemple). L’autre personne le colle dans « Importer ».</p></div>"
+"<div class='cd'><b>Les modes</b><p>QCM libre : la correction s’affiche après chaque réponse. Examen : tu choisis la durée, la correction vient à la fin, tu peux changer de réponse, et il se termine tout seul quand le temps est écoulé. Erreurs : seulement les questions ratées la dernière fois. Exercices : tu fais l’exercice sur papier, tu affiches le corrigé et tu te notes.</p></div>"
+"<div class='cd'><b>Exercices et réponses chiffrées</b><p>Quand la question attend un nombre, tape-le (virgule ou point) : l’appli accepte une petite marge d’arrondi. Les tableaux écrits avec le symbole | (une ligne par ligne du tableau) s’affichent en vrai tableau. Pour les graphiques, note-toi toi-même avec le corrigé.</p></div>"
+"<div class='cd'><b>Reprendre plus tard</b><p>« Quitter et reprendre plus tard » garde ta progression : touche « Reprendre » sur l’accueil. Il n’y a qu’une session en cours à la fois : en lancer une nouvelle remplace l’ancienne. Dans un examen, le chrono continue même si tu quittes.</p></div>"
+"<div class='cd'><b>Hors ligne et installation</b><p>Après une première ouverture avec Internet, ScoreUp s’enregistre sur ton appareil et peut s’ouvrir sans connexion. Seule la lecture d’un PDF demande Internet. Pour l’avoir comme une appli : sur Android, menu du navigateur puis « Installer l’application » ; sur iPhone, bouton Partager puis « Sur l’écran d’accueil ».</p></div><div class='cd'><b>Séries d’exemple</b><p>5 séries de révision (chapitre 1) sont fournies pour tester ScoreUp : comptabilité, marketing, droit, management et statistiques. Tu peux les supprimer, et ce bouton te les redonne.</p><button class='btn s' onclick='ad(this)'>Ajouter les séries d’exemple</button></div><div class='cd'><b>Nouveautés</b><p>Matières avec couleurs (à l’import, ou depuis la liste), statistiques globales et par matière, série de jours de révision, flashcards (touche la carte pour voir la réponse) et mode sombre ou clair en haut de l’accueil, favoris (étoile), sauvegarde complète et mode transport (boutons de navigation en bas).</p></div>"
+"<div class='cd'><b>Mon école</b><p>Au premier lancement, choisis ton école (Management, Droit, Ingénieurs, Digital Campus ou Madiba Leadership Institute). Tu vois ses principales filières et tu peux importer 5 séries de démarrage de 20 questions, niveau L1. Tu peux changer d’école ou ajouter ses séries plus tard depuis « ⚙️ Réglages ».</p></div>"
+"<div class='cd'><b>Import</b><p>L’appli vérifie le format et indique la ligne à corriger. Les doublons sont ignorés. Un PDF doit contenir du vrai texte : une photo ou un scan ne marche pas. Les questions et les choix sont mélangés si la case est cochée, donc la lettre de la bonne réponse change d’un essai à l’autre.</p></div>"
+"<div class='cd'><b>Fiabilité</b><p>Une IA peut se tromper. Vérifie les réponses et les corrigés, surtout les calculs, avec ton cours ou ton prof avant de t’y fier ou de les partager. Demande aussi l’accord de ton prof avant de partager ses fiches.</p></div>"
+"<div class='cd'><b>Réglages</b><p>Le bouton « ⚙️ Réglages » de l’accueil regroupe : ton école, ton prénom, la langue, le thème, le mode transport, l’installation de l’appli, ta licence et ton identifiant, tes données et le contact Thousand Labs.</p></div><div class='cd'><b>Bon à savoir</b><p>Supprimer une série demande deux touches, pour éviter les erreurs. L’historique garde tes 100 derniers résultats.</p></div>"},

const QR=(()=>{

  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};

  const alignPos=v=>{if(v===1)return [];const na=Math.floor(v/7)+2,size=v*4+17,step=v===32?26:Math.ceil((v*4+4)/(na*2-2))*2,r=[6];for(let p=size-7;r.length<na;p-=step)r.splice(1,0,p);return r};
  const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};

      for(let i=0;i<8;i++)setF(size-1-i,8,g(i));for(let i=8;i<15;i++)setF(8,size-15+i,g(i));setF(8,size-8,true)};
    drawFmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bt=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);setF(a,c,bt);setF(c,a,bt)}}

    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&MASKS[m](x,y))M[y][x]=!M[y][x]};

})();

async function startScan(video,status,onText){
  stopScan();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='📵 Caméra non disponible ici. Ouvre l\'appli installée (site en https).';return}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){status.textContent='📵 Accès à la caméra refusé. Autorise-le dans les réglages du navigateur.';return}
  video.setAttribute('playsinline','');video.muted=true;video.srcObject=scanStream;try{await video.play()}catch(e){}
  let detect=null;
  if('BarcodeDetector' in window){try{const bd=new BarcodeDetector({formats:['qr_code']});detect=async()=>{const r=await bd.detect(video);return r.length?r[0].rawValue:null}}catch(e){detect=null}}
  if(!detect){status.textContent='Chargement du lecteur…';try{await loadJsQR()}catch(e){status.textContent='❌ Lecteur QR indisponible hors ligne sur ce téléphone. Utilise le message ou le fichier.';stopScan();return}
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    detect=async()=>{const w=video.videoWidth,h=video.videoHeight;if(!w)return null;const s=Math.min(1,720/Math.max(w,h));cv.width=w*s|0;cv.height=h*s|0;cx.drawImage(video,0,0,cv.width,cv.height);const r=window.jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});return r?r.data:null}}
  if(!scanStream)return;
  status.textContent='🎯 Vise le QR code…';
  let busy=false;scanTimer=setInterval(async()=>{if(busy||!scanStream)return;busy=true;try{const t=await detect();if(t)onText(t)}catch(e){}busy=false},160);
}

function ck(){var m=document.cookie.match(/(?:^|;\s*)su_t=(\d+)/);return m?+m[1]:0}
function trialStart(){var a=+lsg("qcm_trial")||0,b=ck(),t=a&&b?Math.min(a,b):(a||b);
 if(!t){t=Date.now();lss("qcm_trial",String(t))}else if(t!==a)lss("qcm_trial",String(t));
 if(t!==b){try{document.cookie="su_t="+t+";max-age=31536000;path=/;SameSite=Lax"}catch(e){}}return t}
function trialState(){if(ACT)return "act";if(lsg("qcm_lock"))return "cheat";
 var now=Date.now(),last=+lsg("qcm_seen")||0;
 if(last&&now<last-SKEW){lss("qcm_lock","1");return "cheat"}
 return Math.max(now,last)-trialStart()<TRIAL_MS?"trial":"over"}
function seen(){if(ACT)return;var now=Date.now(),last=+lsg("qcm_seen")||0;if(now>last)lss("qcm_seen",String(now))}
function activated(){ACT=true;["qcm_trial","qcm_seen","qcm_lock"].forEach(lsr);try{document.cookie="su_t=;max-age=0;path=/"}catch(e){}}
function leftMs(){return Math.max(0,TRIAL_MS-(Math.max(Date.now(),+lsg("qcm_seen")||0)-trialStart()))}
function leftTxt(){var m=Math.ceil(leftMs()/60000),h=Math.floor(m/60);return h?h+" h "+String(m%60).padStart(2,"0"):m+" min"}

function trialBoot(){var st=trialState();if(st==="trial"){seen();afterAccess()}else gate()}
