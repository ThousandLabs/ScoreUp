E: La communication commerciale vise surtout à vendre des produits ou services.

Q: Qu’est-ce qu’un plan de communication ?
A) Le bilan comptable annuel
B) Un document qui organise les objectifs, les cibles, les messages, les moyens, le budget et le calendrier d’une action de communication
C) Le plan d’un bâtiment
D) La liste des numéros de téléphone d’une entreprise
R: B
E: Il permet de planifier puis d’évaluer les actions.`},
{id:"mad-journ",school:"madiba",name:"Journalisme – Genres et techniques",cat:"Journalisme",txt:`Q: Quelles sont les questions de base auxquelles un article d’information doit répondre ?
A) Est-ce drôle ? Est-ce long ? Est-ce rentable ?
B) Qui ? Quoi ? Où ? Quand ? Comment ? Pourquoi ?
C) Combien ? Pour qui ? Par qui ?
D) Quel titre ? Quelle photo ? Quelle couleur ?
R: B
E: On parle de la règle du QQOQCP, ou des « 5W » en anglais.

Q: Que signifie écrire selon la pyramide inversée ?
A) Garder l’information essentielle pour la fin
B) Donner l’information la plus importante au début, puis les détails
C) Écrire l’article de bas en haut
D) Raconter les faits dans l’ordre chronologique obligatoirement
R: B
E: Le lecteur pressé comprend l’essentiel dès les premières lignes.

Q: Qu’est-ce que le chapeau (chapô) d’un article ?
A) Le court paragraphe placé sous le titre, qui résume l’essentiel et donne envie de lire
B) La signature du journaliste
C) La légende de la photo
D) La dernière phrase de l’article
R: A
E: Il fait le lien entre le titre et le corps de l’article.

Q: Comment appelle-t-on la première phrase d’un article, qui doit accrocher le lecteur ?
A) La chute
B) Le chapeau
C) L’intertitre
D) L’attaque
R: D
E: La chute est la dernière phrase de l’article.

Q: Qu’est-ce qu’une brève ?
A) Un entretien avec une personnalité
B) Une caricature
C) Un article très court qui donne une information sans développement
D) Un long article d’analyse
R: C
E: Elle tient en quelques lignes et répond aux questions essentielles.

Q: Qu’est-ce qu’un reportage ?
A) La simple reprise d’une dépêche
B) Une liste de chiffres
C) Un récit réalisé sur le terrain, qui fait voir et entendre ce que le journaliste a observé
D) Un texte d’opinion du directeur du journal
R: C
E: Le reportage s’appuie sur des descriptions, des témoignages et des détails concrets.

Q: Qu’est-ce que l’éditorial ?
A) Une petite annonce
B) Un programme télévisé
C) Un article neutre sans opinion
D) Un article qui exprime la position de la rédaction ou de la direction du journal
R: D
E: Il est généralement signé par le directeur ou le rédacteur en chef.

Q: Qu’est-ce qu’une enquête journalistique ?
A) Un article de quelques lignes
B) Un dessin humoristique
C) Un sondage d’opinion réalisé en une heure
D) Un travail d’investigation approfondi pour révéler ou expliquer des faits
R: D
E: Elle demande du temps, de nombreuses sources et des vérifications.

Q: Comment s’appelle l’agence de presse nationale du Sénégal ?
A) L’Agence France-Presse (AFP)
B) L’Agence de presse sénégalaise (APS)
C) La RTS
D) Reuters
R: B
E: La RTS est la radiotélévision publique, l’AFP une agence française.

Q: Que signifie recouper une information ?
A) La publier sur plusieurs réseaux sociaux
B) La traduire dans une autre langue
C) La confirmer auprès de plusieurs sources indépendantes avant de la publier
D) La raccourcir pour qu’elle tienne dans la page
R: C
E: Le recoupement est une règle de base pour éviter les erreurs.

Q: Que signifie une information donnée « off » (off the record) ?
A) Le journaliste peut s’en servir pour comprendre, mais ne doit pas la citer ni l’attribuer à sa source
B) Elle est fausse
C) Elle est réservée à la radio
D) Elle doit être publiée immédiatement avec le nom de la source
R: A
E: Respecter le « off » est une question de confiance avec les sources.

Q: Qu’est-ce que la Charte de Munich (1971) ?
A) La loi qui crée les radios privées
B) Une déclaration des devoirs et des droits des journalistes
C) Un traité de paix européen
D) Un accord commercial entre agences de presse
R: B
E: Elle sert de référence déontologique dans de nombreux pays.

Q: Qu’est-ce qu’une fake news (infox) ?
A) Une information publiée à la radio
B) Une information récente
C) Une fausse information présentée comme vraie
D) Une information traduite
R: C
E: Elle circule souvent très vite sur les réseaux sociaux.

Q: Qu’est-ce que le fact-checking ?
A) La vérification des faits et des déclarations publiques
B) La vente d’espaces publicitaires
C) La rédaction des titres
D) La mise en page d’un journal
R: A

/* ---------- Annales : sujets d'examen (QCM + exercices) ----------
   Format :
   ANNALE: titre   DUREE: 120
   Q:/A)…/R:/E:/P:   → QCM (P: points, 1 par défaut)
   EX: titre, énoncé, puis Q:/N:/C:/P:   → exercice (2 points par défaut) */
function parseAn(txt){var I=[],E=[],ti="",du=0,ex=null,it=null,last=null,m;
 txt.replace(/\r/g,"").split("\n").forEach(function(raw){var t=raw.trim();if(!t)return;
  if(m=t.match(/^ANNALE\s*:\s*(.*)$/i)){ti=m[1].trim();last=null;return}
  if(m=t.match(/^DUR[ÉE]E\s*:\s*(\d+)/i)){du=+m[1];return}
  if(/^(PARTIE\s+)?QCM\s*:?\s*$/i.test(t)){ex=null;it=null;last=null;return}
  if(m=t.match(/^EX\s*\d*\s*:\s*(.*)$/i)){ex={t:m[1]||"Exercice",s:""};it=null;last="s";return}
  if(m=t.match(/^Q\s*\d*\s*[:.]\s*(.*)$/i)){it=ex?{ty:"x",t:ex.t,s:ex.s,q:m[1],n:"",c:"",p:null}:{ty:"q",q:m[1],c:[],l:[],r:null,e:"",p:null};I.push(it);last="q";return}
  if(m=t.match(/^P(?:oints?)?\s*:\s*([\d]+(?:[.,]\d+)?)\s*(pts?|points?)?\s*$/i)){if(it)it.p=parseFloat(m[1].replace(",","."));return}
  if(it&&(m=t.match(/^([A-F])\s*[\).]\s*(.*)$/i))&&(it.ty==="q"||(!it.c&&!it.n&&last==="q"))){if(it.ty==="x"){var nq={ty:"q",q:it.q,c:[],l:[],r:null,e:"",p:null};I[I.length-1]=nq;it=nq;ex=null}it.l.push(m[1].toUpperCase());it.c.push(m[2]);last="c";return}
  if(it&&it.ty==="q"){if(m=t.match(/^R(?:[ée]ponse)?\s*:\s*([A-F])/i)){it.r=m[1].toUpperCase();last="r";return}if(m=t.match(/^E(?:xplication)?\s*:\s*(.*)$/i)){it.e=m[1];last="e";return}}
  if(it&&it.ty==="x"){if(m=t.match(/^N\s*:\s*(.*)$/i)){it.n=m[1].trim();last="n";return}if(m=t.match(/^C\s*:\s*(.*)$/i)){it.c=m[1];last="k";return}}
  if(last==="s"&&ex){ex.s+=(ex.s?"\n":"")+t;return}
  if(!it)return;
  if(last==="q")it.q+=(it.ty==="x"?"\n":" ")+t;else if(last==="c")it.c[it.c.length-1]+=" "+t;else if(last==="e")it.e+=" "+t;else if(last==="k")it.c+="\n"+t});
 var Q=[];I.forEach(function(b,i){var p="Question "+(i+1)+" : ";
  if(!b.q.trim())return E.push(p+"l’énoncé est vide.");
  if(b.ty==="q"){if(b.c.length<2)return E.push(p+"il faut au moins 2 choix (A, B…).");if(!b.r)return E.push(p+"la ligne « R: » est manquante.");var k=b.l.indexOf(b.r);if(k<0)return E.push(p+"la réponse "+b.r+" ne correspond à aucun choix.");
   Q.push({ty:"q",q:b.q.trim(),c:b.c.map(function(x){return x.trim()}),r:k,e:b.e.trim(),p:b.p==null?1:b.p})}
  else{if(!b.c.trim())return E.push(p+"la ligne « C: » (corrigé) est manquante.");if(b.n!==""&&isNaN(pn(b.n)))return E.push(p+"« N: » doit être un nombre.");
   Q.push({ty:"x",t:b.t.trim(),s:b.s.trim(),q:b.q.trim(),n:b.n===""?"":(pnAll(b.n).length>1?b.n.replace(/[\s\u00a0\u202f]/g,""):String(pn(b.n))),c:b.c.trim(),p:b.p==null?2:b.p})}});
 return {Q:Q,E:E,n:I.length,an:1,ti:ti,du:du}}

function anLine(s){var a=anInfo(s);return "<span>"+a.nq+" QCM</span> · <span>"+a.nx+" "+plur(a.nx,"question")+" d’exercice</span> · <span>"+(s.dur||120)+" min</span>"}

var PROMPT_AN="Tu es un professeur d’université expert et rigoureux. Je te fournis un ancien sujet d’examen (photo, PDF ou texte). Transforme-le en annale pour l’application ScoreUp, avec un corrigé détaillé.\n\nRègles :\n- Recopie fidèlement le sujet : n’invente aucune donnée et ne change aucun chiffre. Si un passage est illisible, écris [illisible] au lieu de deviner.\n- QCM : une ligne Q: par question, puis les choix A) B) C) D), la lettre de la bonne réponse après R: et une courte explication après E:. Si le sujet ne donne pas la bonne réponse, trouve-la et vérifie-la deux fois.\n- Exercices : une ligne EX: avec le titre, puis l’énoncé et les données, puis chaque question avec Q:. Après chaque question : N: la réponse sous forme d’un seul nombre sans unité (supprime cette ligne si la réponse n’est pas un seul nombre), puis C: le corrigé détaillé. Fais chaque calcul pas à pas, puis refais-le une seconde fois pour vérifier.\n- Les questions de cours sans choix se traitent comme un exercice : EX: Questions de cours, puis Q: et C: pour chacune.\n- Tableaux (bilan, journal, comptes…) : écris-les en texte, une ligne par ligne du tableau, cellules séparées par le symbole |, la première ligne contenant les en-têtes.\n- Graphiques (courbe cumulative croissante ou décroissante, polygone, histogramme, diagramme circulaire, diagramme en barres ou en bâtons, nuage de points, droites du seuil de rentabilité…) : quand une question demande un graphique, écris dans C: une ligne G: type ; titre ; nom de l’axe horizontal ; nom de l’axe vertical, puis juste en dessous le tableau des points avec le symbole |, une ligne par point et la première ligne pour les en-têtes. Première colonne : les valeurs de l’axe horizontal. Colonnes suivantes : une colonne par courbe (3 au maximum), avec des nombres seuls. Courbe cumulative : en première colonne toutes les bornes des classes, de la première à la dernière (l’effectif cumulé croissant vaut 0 à la première borne, le décroissant vaut 0 à la dernière). Histogramme : en première colonne les classes sous la forme [a ; b[, en deuxième la hauteur des rectangles (effectif corrigé si les classes n’ont pas toutes la même amplitude). Diagramme circulaire : en première colonne les modalités, en deuxième les effectifs ; l’appli calcule elle-même les pourcentages et les angles, mais détaille aussi le calcul des angles dans C: (angle = effectif × 360 / effectif total). Si le sujet contient lui-même un graphique, recopie ses points de la même façon dans l’énoncé (écris [illisible] pour un point que tu ne peux pas lire). Exemple :\nG: courbe cumulative croissante ; Salaires des employés ; Salaire (milliers F) ; Effectifs cumulés croissants\nSalaire | ECC\n0 | 0\n50 | 12\n100 | 30\n150 | 40\nVérifie chaque point avant de l’écrire. L’appli dessine le graphique à partir de ce tableau.\n- Barème : après chaque question (QCM ou exercice), ajoute une ligne P: avec ses points selon le barème du sujet. Sans barème, mets P: 1 pour chaque QCM et répartis les points des exercices pour que le total fasse 20.\n- Durée : indique la durée de l’épreuve en minutes après DUREE: (120 si elle n’est pas indiquée).\n- Respecte exactement ce format :\nANNALE: matière – type d’épreuve – année\nDUREE: 120\nQ: question de QCM\nA) premier choix\nB) deuxième choix\nC) troisième choix\nD) quatrième choix\nR: B\nE: courte explication\nP: 1\nEX: titre de l’exercice\n(énoncé, données et tableaux écrits en texte)\nQ: première question de l’exercice\nN: 125000\nC: corrigé détaillé avec les calculs\nP: 3\n\nÉcris tout directement dans ta réponse, sans PDF, sans gras, sans balises markdown et sans autre texte.\n\nVoici le sujet :\n";
var PROMPT_AN_EN="You are a rigorous, expert university lecturer. I'm giving you a past exam paper (photo, PDF or text). Turn it into a past paper for the ScoreUp app, with a detailed solution.\n\nRules:\n- Copy the paper faithfully: don't make up any data and don't change any figure. If a part is unreadable, write [unreadable] instead of guessing.\n- Multiple-choice questions: one Q: line per question, then the choices A) B) C) D), the letter of the correct answer after R: and a short explanation after E:. If the paper doesn't give the correct answer, find it and check it twice.\n- Exercises: one EX: line with the title, then the statement and data, then each question with Q:. After each question: N: the answer as a single number without unit (remove this line if the answer isn't a single number), then C: the detailed solution. Do each calculation step by step, then do it a second time to check.\n- Written course questions without choices are treated as an exercise: EX: Course questions, then Q: and C: for each one.\n- Tables (balance sheet, journal, accounts…): write them as text, one line per table row, cells separated by the | symbol, the first line containing the headers.\n- Graphs (cumulative frequency curve, increasing or decreasing, frequency polygon, histogram, pie chart, bar or stick chart, scatter plot, break-even lines…): when a question asks for a graph, write in C: a line G: type ; title ; name of the horizontal axis ; name of the vertical axis, then right below it the table of points with the | symbol, one line per point and the first line for the headers. First column: the values on the horizontal axis. Next columns: one column per curve (3 at most), with numbers only. Cumulative curve: in the first column, all the class boundaries, from the first to the last (the increasing cumulative frequency is 0 at the first boundary, the decreasing one is 0 at the last). Histogram: in the first column, the classes written as [a ; b[, in the second, the height of the bars (adjusted frequency if the classes don't all have the same width). Pie chart: in the first column, the categories, in the second, the frequencies; the app works out the percentages and angles itself, but also show the angle calculation in C: (angle = frequency × 360 / total frequency). If the paper itself contains a graph, copy its points the same way in the statement (write [unreadable] for a point you can't read). Example:\nG: cumulative frequency curve increasing ; Employee salaries ; Salary (thousand F) ; Increasing cumulative frequencies\nSalary | ICF\n0 | 0\n50 | 12\n100 | 30\n150 | 40\nCheck every point before writing it. The app draws the graph from this table.\n- Marking scheme: after each question (multiple-choice or exercise), add a P: line with its points according to the paper's marking scheme. Without a marking scheme, put P: 1 for each multiple-choice question and share out the exercise points so that the total is 20.\n- Duration: give the length of the exam in minutes after DUREE: (120 if it isn't given).\n- Follow this format exactly:\nANNALE: subject – type of exam – year\nDUREE: 120\nQ: multiple-choice question\nA) first choice\nB) second choice\nC) third choice\nD) fourth choice\nR: B\nE: short explanation\nP: 1\nEX: title of the exercise\n(statement, data and tables written as text)\nQ: first question of the exercise\nN: 125000\nC: detailed solution with the calculations\nP: 3\n\nWrite everything directly in your reply, no PDF, no bold, no markdown tags and no other text.\n\nHere is the paper:\n";

+"<div class='cd'><b>À quoi ça sert</b><p>L’appli est vide au départ : tu y mets tes propres questions ou exercices, elle te fait réviser et te note. Rien n’est envoyé sur Internet.</p></div>"
+"<div class='cd'><b>Pour démarrer</b><p>1. Ouvre « Comment faire » et copie le prompt. 2. Colle-le dans une IA avec ton cours. 3. Importe le résultat (texte collé ou PDF). 4. Touche « Lancer ».</p></div>"
+"<div class='cd b'><b>⚠️ Tes séries peuvent disparaître</b><p>Elles sont gardées dans le navigateur de cet appareil, pas en ligne. Elles disparaissent si tu vides les données du navigateur ou si tu utilises la navigation privée, et elles ne passent pas d’un téléphone ou d’un navigateur à l’autre. Pour en garder une copie : « Exporter », « Copier la série », puis garde le texte dans un fichier ou dans un message WhatsApp à toi-même.</p></div>"
+"<div class='cd'><b>Activation et essai gratuit</b><p>À la première ouverture, tu as 48 heures d’essai gratuit complet. Ensuite, un code d’activation est nécessaire. Reculer l’heure du téléphone pendant l’essai bloque l’appli : seul un code d’activation la débloque. Une fois l’appli activée, plus aucune vérification de l’heure n’est faite.</p><p>Le code d’activation ne marche que sur l’appareil pour lequel il a été généré. Si tu vides les données du navigateur ou si tu changes de téléphone, demande un nouveau code.</p></div>"
+"<div class='cd'><b>Partager une série</b><p>« Exporter », « Copier la série », puis envoie le texte (par WhatsApp par exemple). L’autre personne le colle dans « Importer ».</p></div>"
+"<div class='cd'><b>Les modes</b><p>QCM libre : la correction s’affiche après chaque réponse. Examen : tu choisis la durée, la correction vient à la fin, tu peux changer de réponse, et il se termine tout seul quand le temps est écoulé. Erreurs : seulement les questions ratées la dernière fois. Exercices : tu fais l’exercice sur papier, tu affiches le corrigé et tu te notes.</p></div>"
+"<div class='cd'><b>Exercices et réponses chiffrées</b><p>Quand la question attend un nombre, tape-le (virgule ou point) : l’appli accepte une petite marge d’arrondi. Les tableaux écrits avec le symbole | (une ligne par ligne du tableau) s’affichent en vrai tableau. Les graphiques demandés (courbes cumulatives, histogrammes, diagrammes circulaires…) sont dessinés dans le corrigé : trace le tien sur papier, compare, puis note-toi toi-même.</p></div>"
+"<div class='cd'><b>Reprendre plus tard</b><p>« Quitter et reprendre plus tard » garde ta progression : touche « Reprendre » sur l’accueil. Il n’y a qu’une session en cours à la fois : en lancer une nouvelle remplace l’ancienne. Dans un examen, le chrono continue même si tu quittes.</p></div>"
+"<div class='cd'><b>Hors ligne et installation</b><p>Après une première ouverture avec Internet, ScoreUp s’enregistre sur ton appareil et peut s’ouvrir sans connexion. Seule la lecture d’un PDF demande Internet. Pour l’avoir comme une appli : sur Android, menu du navigateur puis « Installer l’application » ; sur iPhone, bouton Partager puis « Sur l’écran d’accueil ».</p></div><div class='cd'><b>Séries d’exemple</b><p>5 séries de révision (chapitre 1) sont fournies pour tester ScoreUp : comptabilité, marketing, droit, management et statistiques, ainsi que 5 exercices corrigés de comptabilité (chapitres 1 et 2). Tu peux les supprimer, et ce bouton te les redonne.</p><button class='btn s' onclick='ad(this)'>Ajouter les séries d’exemple</button></div><div class='cd'><b>Nouveautés</b><p>Nouveau : les graphiques. Dans les annales et les exercices corrigés, ScoreUp dessine les courbes cumulatives croissantes et décroissantes, les polygones, les histogrammes, les diagrammes circulaires (avec pourcentages et angles), les diagrammes en barres ou en bâtons et les nuages de points demandés. Copie de nouveau le prompt Annales ou Exercices pour en profiter.</p><p>Pendant les QCM, le bouton « Suivant » reste toujours visible en bas de l’écran, et « Masquer les détails » replie l’explication. Glisse vers la gauche pour passer à la question suivante. Les options d’une question (corriger, modifier, signaler) sont réunies dans le bouton ⋯. Pour te motiver : points XP, niveaux, badges, objectif du jour, joker de série, calendrier de révision, maîtrise de chaque série et image de résultat à partager.</p><p>Encore plus récent : « Révision éclair » (10 questions mélangées de toutes tes séries), révision de tes favoris en QCM, partage d’un badge en image et bilan de la semaine.</p></div><div class='cd'><b>Aussi dans ScoreUp</b><p>Matières avec couleurs (à l’import, ou depuis la liste), statistiques globales et par matière, série de jours de révision, flashcards (touche la carte pour voir la réponse) et mode sombre ou clair en haut de l’accueil, favoris (étoile), sauvegarde complète avec copies automatiques de secours sur le téléphone (14 jours) et mode transport (boutons de navigation en bas).</p></div>"
+"<div class='cd'><b>Pendant les QCM</b><p>Le bouton « Suivant » reste en bas de l’écran : plus besoin de descendre. Touche « Masquer les détails » pour replier l’explication et l’avertissement ; ton choix est gardé pour les prochaines séances. Tu peux aussi glisser vers la gauche pour passer à la question suivante, et vers la droite pour revenir en arrière en mode Examen. Le bouton ⋯ réunit « Corriger cette réponse », « Modifier toute la question » et « Signaler comme douteuse ». La barre du haut se colore : vert pour une bonne réponse, rouge pour une erreur.</p></div>"
+"<div class='cd'><b>⌨️ Sur ordinateur</b><p>Réponds avec les touches A, B, C, D (ou 1, 2, 3, 4), puis Entrée ou la flèche droite pour passer à la suite. La flèche gauche revient en arrière en mode Examen.</p></div>"
+"<div class='cd'><b>⚡ XP, niveaux et badges</b><p>Chaque bonne réponse rapporte 10 XP. Une séance d’au moins 5 questions rapporte 20 XP de plus, et un sans-faute (10 questions ou plus) 50 XP. Enchaîne les bonnes réponses pour faire un combo : à partir de 5 d’affilée, tu gagnes un bonus. Les XP font monter ton niveau, de Débutant à Légende. Les badges récompensent ta régularité et tes exploits : retrouve-les dans le menu ☰, « Mes badges ».</p></div>"
+"<div class='cd'><b>🎯 Objectif du jour et joker</b><p>Choisis ton objectif dans les Réglages : 10, 20, 30 ou 50 questions par jour. L’anneau de l’accueil se remplit au fil de tes séances, et l’objectif atteint rapporte 30 XP. Le joker protège ta série de jours : si tu oublies un seul jour, ta série continue. Tu as un joker par semaine, utilisé automatiquement.</p></div>"
+"<div class='cd'><b>🏆 Résultat et partage</b><p>Après chaque séance : ta note dans un anneau, ta mention, un message quand tu bats ton record sur la série, et un filtre « Mes erreurs » pour ne relire que les questions ratées. « Partager mon résultat » crée une image à envoyer sur WhatsApp ou en statut.</p></div>"
+"<div class='cd'><b>⚡ Révision éclair et favoris</b><p>Sur l’accueil, « Révision éclair » lance 10 questions tirées de toutes tes séries, en commençant par celles à revoir aujourd’hui. Idéal pour remplir ton objectif du jour en quelques minutes. Dans « Favoris », « Réviser mes favoris en QCM » te fait repasser toutes les questions marquées d’une étoile.</p></div>"
+"<div class='cd'><b>📊 Bilan de la semaine</b><p>Chaque lundi, l’accueil affiche le bilan de ta semaine précédente : questions faites, taux de réussite, jours actifs, note moyenne, évolution par rapport à la semaine d’avant et matière à travailler. Touche « OK, vu » pour le ranger. La semaine en cours est dans « Statistiques ».</p></div>"
+"<div class='cd'><b>🏅 Partager un badge</b><p>Dans « Mes badges », touche un badge débloqué : ScoreUp crée une image à envoyer sur WhatsApp ou en statut.</p></div>"
+"<div class='cd'><b>📊 Maîtrise et calendrier</b><p>Sur l’accueil, chaque série affiche sa maîtrise : la part de ses questions réussies au moins 3 fois de suite en révision espacée. Dans « Statistiques », le calendrier montre tes jours de révision des 12 dernières semaines.</p></div>"
+"<div class='cd'><b>Note sur 20</b><p>Chaque séance donne une note sur 20, comme à l’examen. En mode Examen, tu peux activer les points négatifs : −0,25 par mauvaise réponse (une question sans réponse vaut 0).</p></div><div class='cd'><b>Révision espacée</b><p>Chaque question a sa propre date de retour. Ratée : elle revient le jour même. Juste : elle revient après 1 jour, puis 3, 7, 15 et 30 jours. Ouvre l’appli chaque jour et suis « 🔁 À revoir aujourd’hui ».</p></div><div class='cd'><b>Mes examens</b><p>Ajoute la date de tes partiels (menu ☰, « Mes examens ») : l’accueil affiche le compte à rebours et le nombre de questions à revoir par jour pour être prêt(e) à temps.</p></div><div class='cd'><b>Points faibles</b><p>Dans « Statistiques », tes séries sont classées de la plus faible à la plus solide, avec un bouton pour réviser directement le chapitre à retravailler.</p></div><div class='cd'><b>Annales</b><p>Entraîne-toi sur d’anciens sujets d’examen : QCM et exercices, chronométrés. Copie le prompt Annales, donne-le à une IA avec une photo ou un PDF du sujet, puis importe sa réponse. À la fin, QCM et réponses chiffrées sont notés tout seuls ; pour le reste, tu te notes avec le corrigé. Tu obtiens une note sur 20.</p><p>Courbes cumulatives, histogrammes, polygones, diagrammes circulaires, diagrammes en barres ou en bâtons, nuages de points : quand le sujet demande un graphique, ScoreUp le dessine dans le corrigé.</p></div><div class='cd'><b>Défier un ami</b><p>Après une séance, touche « ⚔️ Défier un ami » : ton ami reçoit la série et ton score par WhatsApp, l’importe dans ScoreUp et tente de faire mieux.</p></div><div class='cd'><b>Rechercher</b><p>Retrouve n’importe quelle question ou notion (par exemple « amortissement ») dans toutes tes séries.</p></div><div class='cd'><b>Mode édition</b><p>Dans « ⚙️ Réglages », active le mode édition pour corriger une question fausse, en ajouter ou en supprimer, sans supprimer toute la série.</p></div><div class='cd'><b>Questions douteuses</b><p>Pendant la révision ou dans la correction, « Signaler comme douteuse » met une question de côté : elle ne sort plus dans tes séances. Sur la page de la série, retrouve la liste des questions signalées, puis touche « C’est vérifié » ou « Corriger ». Une question signalée pendant une séance compte encore dans la note de cette séance.</p></div><div class='cd'><b>Vérifier une série avec une IA</b><p>Ouvre une série, puis « Vérifier la série avec une IA ». Copie le prompt de vérification, colle-le dans une autre IA (de préférence pas celle qui a créé la série) et joins ton cours. Elle te renvoie les numéros des questions fausses avec une correction proposée : corrige-les ou signale-les dans ScoreUp.</p></div><div class='cd'><b>Mon école</b><p>Au premier lancement, choisis ton école (Management, Droit, Ingénieurs, Digital Campus ou Madiba Leadership Institute). Tu vois ses principales filières et tu peux importer 5 séries de démarrage de 20 questions, niveau L1. Tu peux changer d’école ou ajouter ses séries plus tard depuis « ⚙️ Réglages ».</p></div>"
+"<div class='cd'><b>Import</b><p>L’appli vérifie le format et indique la ligne à corriger. Les doublons sont ignorés. Un PDF doit contenir du vrai texte : une photo ou un scan ne marche pas. Les questions et les choix sont mélangés si la case est cochée, donc la lettre de la bonne réponse change d’un essai à l’autre.</p><p>Les boutons Gemini, ChatGPT et Claude ouvrent l’IA directement. Le bouton « Coller depuis le presse-papiers » colle et vérifie le texte en une touche. Sur Android, si ScoreUp est installée, « Partager » → ScoreUp depuis l’appli de l’IA envoie la série directement dans l’import (si ScoreUp n’apparaît pas dans la liste, désinstalle puis réinstalle l’appli une fois).</p></div>"
+"<div class='cd'><b>Fiabilité</b><p>Une IA peut se tromper. Vérifie les réponses et les corrigés, surtout les calculs, avec ton cours ou ton prof avant de t’y fier ou de les partager. Demande aussi l’accord de ton prof avant de partager ses fiches.</p><p>Pour t’aider : « Signaler comme douteuse » et « Vérifier la série avec une IA » (voir plus bas).</p></div>"
+"<div class='cd'><b>Réglages</b><p>Le bouton ☰ en haut à droite ouvre le menu : Accueil, Statistiques, Historique, Favoris, Sauvegarde, Réglages, aide, thème et mode transport, depuis n’importe quel écran. Le bouton retour du téléphone ramène à l’accueil. « ⚙️ Réglages » regroupe : ton école, ton prénom, la langue, le thème, le mode transport, l’installation de l’appli, ta licence et ton identifiant, tes données et le contact Thousand Labs.</p></div><div class='cd'><b>Bon à savoir</b><p>Supprimer une série demande deux touches, pour éviter les erreurs. L’historique garde tes 100 derniers résultats.</p></div>"},

const QR=(()=>{
  const ECC={L:[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],M:[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]};
  const BLK={L:[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]};
  const FMT={L:1,M:0};
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const rawModules=v=>{let r=(16*v+128)*v+64;if(v>=2){const na=Math.floor(v/7)+2;r-=(25*na-10)*na-55;if(v>=7)r-=36}return r};
  const dataCw=(v,e)=>Math.floor(rawModules(v)/8)-ECC[e][v]*BLK[e][v];
  const alignPos=v=>{if(v===1)return [];const na=Math.floor(v/7)+2,size=v*4+17,step=v===32?26:Math.ceil((v*4+4)/(na*2-2))*2,r=[6];for(let p=size-7;r.length<na;p-=step)r.splice(1,0,p);return r};
  const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rsRem=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
  const MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  function penalty(M,n){let p=0,dark=0;
    for(let a=0;a<n;a++){let rr=1,rc=1;for(let b=1;b<=n;b++){if(b<n&&M[a][b]===M[a][b-1])rr++;else{if(rr>=5)p+=rr-2;rr=1}if(b<n&&M[b][a]===M[b-1][a])rc++;else{if(rc>=5)p+=rc-2;rc=1}}}
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(M[y][x])dark++;if(y<n-1&&x<n-1){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}}
    return p+Math.max(0,Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10}
  function encode(text,e){e=e||'L';const bytes=Array.from(new TextEncoder().encode(text));let v=1,cap=0;
    for(;v<=40;v++){cap=dataCw(v,e)*8;if(4+(v<10?8:16)+bytes.length*8<=cap)break}
    if(v>40)throw new Error('Données trop longues pour un QR code');
    const bits=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    const nb=BLK[e][v],el=ECC[e][v],raw=Math.floor(rawModules(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-el+(i<nShort?0:1));k+=dat.length;const ec=rsRem(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(ec))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-el||j>=nShort)all.push(b[i])});
    const size=v*4+17,M=Array.from({length:size},()=>new Array(size).fill(false)),F=Array.from({length:size},()=>new Array(size).fill(false));
    const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
    [[3,3],[size-4,3],[3,size-4]].forEach(([cx,cy])=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const xx=cx+dx,yy=cy+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size){const d=Math.max(Math.abs(dx),Math.abs(dy));setF(xx,yy,d!==2&&d!==4)}}});
    const ap=alignPos(v),na=ap.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    const drawFmt=m=>{const d=FMT[e]<<3|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)setF(8,i,g(i));setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));for(let i=9;i<15;i++)setF(14-i,8,g(i));
      for(let i=0;i<8;i++)setF(size-1-i,8,g(i));for(let i=8;i<15;i++)setF(8,size-15+i,g(i));setF(8,size-8,true)};
    drawFmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bt=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);setF(a,c,bt);setF(c,a,bt)}}
    let idx=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!F[y][x]&&idx<all.length*8){M[y][x]=((all[idx>>>3]>>>(7-(idx&7)))&1)!==0;idx++}}}
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&MASKS[m](x,y))M[y][x]=!M[y][x]};
    let best=0,bp=Infinity;for(let m=0;m<8;m++){apply(m);drawFmt(m);const p=penalty(M,size);if(p<bp){bp=p;best=m}apply(m)}
    apply(best);drawFmt(best);return M}
  function canvas(text,px,e){const q=encode(text,e),n=q.length,quiet=4,total=n+quiet*2,scale=Math.max(2,Math.floor((px||300)/total)),c=document.createElement('canvas');
    c.width=c.height=total*scale;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
    for(let y=0;y<n;y++)for(let xx=0;xx<n;xx++)if(q[y][xx])x.fillRect((xx+quiet)*scale,(y+quiet)*scale,scale,scale);c.className='qr';return c}
  return {encode,canvas};
})();

/* Lecteur : BarcodeDetector (Android/Chrome) sinon jsQR chargé à la demande (puis gardé hors ligne) */
let scanStream=null,scanTimer=null;
function loadJsQR(){return new Promise((ok,ko)=>{if(window.jsQR)return ok();const s=document.createElement('script');s.src='./jsQR.js';/* jsQR 1.4.0 (github.com/cozmo/jsQR), hébergé avec l'appli : aucun script externe */s.onload=()=>window.jsQR?ok():ko();s.onerror=ko;document.head.appendChild(s)})}
async function startScan(video,status,onText){
  stopScan();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='📵 Caméra non disponible ici. Ouvre l\'appli installée (site en https).';return}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){status.textContent='📵 Accès à la caméra refusé. Autorise-le dans les réglages du navigateur.';return}
  video.setAttribute('playsinline','');video.muted=true;video.srcObject=scanStream;try{await video.play()}catch(e){}
  let detect=null;
  if('BarcodeDetector' in window){try{const bd=new BarcodeDetector({formats:['qr_code']});detect=async()=>{const r=await bd.detect(video);return r.length?r[0].rawValue:null}}catch(e){detect=null}}
  if(!detect){status.textContent='Chargement du lecteur…';try{await loadJsQR()}catch(e){status.textContent='❌ Lecteur QR indisponible hors ligne sur ce téléphone. Utilise le message ou le fichier.';stopScan();return}
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    detect=async()=>{const w=video.videoWidth,h=video.videoHeight;if(!w)return null;const s=Math.min(1,720/Math.max(w,h));cv.width=w*s|0;cv.height=h*s|0;cx.drawImage(video,0,0,cv.width,cv.height);const r=window.jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});return r?r.data:null}}
  if(!scanStream)return;
  status.textContent='🎯 Vise le QR code…';
  let busy=false;scanTimer=setInterval(async()=>{if(busy||!scanStream)return;busy=true;try{const t=await detect();if(t)onText(t)}catch(e){}busy=false},160);
}
function stopScan(){clearInterval(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}

/* ---------- Essai gratuit 48 h, anti-recul d'horloge, prénom ----------
   • qcm_trial : date de début de l'essai (aussi copiée dans un cookie).
   • qcm_seen  : dernière heure vue (mise à jour à chaque action).
   • Si l'heure recule de plus de 2 min par rapport à qcm_seen → verrou définitif (qcm_lock).
   • Après activation : ces clés sont effacées et plus rien n'est suivi.          */
var ACT=false,TRIAL_MS=48*3600000,SKEW=2*60000;
function lsg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsr(k){try{localStorage.removeItem(k)}catch(e){}}
function ck(){var m=document.cookie.match(/(?:^|;\s*)su_t=(\d+)/);return m?+m[1]:0}
function trialStart(){var a=+lsg("qcm_trial")||0,b=ck(),t=a&&b?Math.min(a,b):(a||b);
 if(!t){t=Date.now();lss("qcm_trial",String(t))}else if(t!==a)lss("qcm_trial",String(t));
 if(t!==b){try{document.cookie="su_t="+t+";max-age=31536000;path=/;SameSite=Lax"}catch(e){}}return t}
function trialState(){if(ACT)return "act";if(lsg("qcm_lock"))return "cheat";
 var now=Date.now(),last=+lsg("qcm_seen")||0;
 if(last&&now<last-SKEW){lss("qcm_lock","1");return "cheat"}
 return Math.max(now,last)-trialStart()<TRIAL_MS?"trial":"over"}
function seen(){if(ACT)return;tlHeal();var now=Date.now(),last=+lsg("qcm_seen")||0;if(now>last)lss("qcm_seen",String(now))}
function activated(){ACT=true;["qcm_trial","qcm_seen","qcm_lock"].forEach(lsr);try{document.cookie="su_t=;max-age=0;path=/"}catch(e){}}
function leftMs(){return Math.max(0,TRIAL_MS-(Math.max(Date.now(),+lsg("qcm_seen")||0)-trialStart()))}
function leftTxt(){var m=Math.ceil(leftMs()/60000),h=Math.floor(m/60);return h?h+" h "+String(m%60).padStart(2,"0"):m+" min"}
function trialBanner(){if(ACT)return "";return "<div class='cd' style='border-left:5px solid var(--ac)'><b>🎁 Essai gratuit : il reste "+leftTxt()+"</b><p class='mu'>Tu as accès à tout ScoreUp pendant 48 heures. Active l’appli pour la garder.</p><button class='btn s' onclick='gate()'>Activer ScoreUp</button></div>"}

/* ---------- 🎁 Traces de l'essai gratuit ----------
   La date de début de l'essai est recopiée à 4 endroits (stockage local, cookie, base interne, cache).
   S'il en reste une seule, l'essai est restauré : effacer « juste le cache » ou « juste les cookies »
   ne relance pas l'essai. Seul l'effacement complet des données du site y parvient… et il efface aussi
   toutes les données de toutes les applis Thousand Labs. Aucune empreinte du téléphone n'est utilisée. */
const TLT=(()=>{const K='tl_trial_'+'scoreup',OK=v=>v>1.6e12&&v<4e12;
  const ckGet=()=>{try{const m=document.cookie.match(new RegExp('(?:^|;\\s*)'+K+'=(\\d+)'));return m?+m[1]:0}catch(e){return 0}};
  const ckSet=v=>{try{document.cookie=K+'='+v+';max-age=315360000;path=/;SameSite=Lax'}catch(e){}};
  const idb=(w,v)=>new Promise(res=>{try{const r=indexedDB.open('thousandlabs',1);r.onupgradeneeded=()=>{try{r.result.createObjectStore('kv')}catch(e){}};r.onerror=()=>res(0);
    r.onsuccess=()=>{try{const tx=r.result.transaction('kv',w?'readwrite':'readonly'),st=tx.objectStore('kv');if(!w){const g=st.get(K);g.onsuccess=()=>res(+g.result||0);g.onerror=()=>res(0)}else{st.put(v,K);tx.oncomplete=()=>res(1);tx.onerror=()=>res(0)}}catch(e){res(0)}}}catch(e){res(0)}});
  const cGet=async()=>{try{const c=await caches.open('tl-trace'),m=await c.match('./__tl/'+K);return m?+(await m.text())||0:0}catch(e){return 0}};
  const cSet=async v=>{try{const c=await caches.open('tl-trace');await c.put('./__tl/'+K,new Response(String(v)))}catch(e){}};
  let last=0;
  async function sync(cur,restore,force){const n=Date.now();if(!force&&n-last<30000)return;last=n;
    try{const all=[+cur||0,ckGet(),await idb(false),await cGet()].filter(OK);if(!all.length)return;const t=Math.min(...all);
      if(ckGet()!==t)ckSet(t);idb(true,t);cSet(t);if(t!==(+cur||0))restore(t)}catch(e){}}
  function reloadOnce(){try{if(sessionStorage.getItem('h_'+K))return;sessionStorage.setItem('h_'+K,'1')}catch(e){return}location.reload()}
  return {sync,reloadOnce}})();
function tlHeal(f){if(ACT)return;TLT.sync(+lsg("qcm_trial")||0,function(t){if(ACT)return;lss("qcm_trial",String(t));TLT.reloadOnce()},f)}
  function trialBoot(){setTimeout(function(){tlHeal(true)},0);var st=trialState();if(st==="trial"){seen();afterAccess()}else gate()}
