"1. Ouvre « Comment faire » et copie le prompt. 2. Colle-le dans une IA avec ton cours. 3. Importe le résultat (texte collé ou PDF). 4. Touche « Lancer ».": "1. Open “How to” and copy the prompt. 2. Paste it into an AI with your course. 3. Import the result (pasted text or PDF). 4. Tap “Start”.",
"⚠️ Tes séries peuvent disparaître": "⚠️ Your sets can disappear",
"Elles sont gardées dans le navigateur de cet appareil, pas en ligne. Elles disparaissent si tu vides les données du navigateur ou si tu utilises la navigation privée, et elles ne passent pas d’un téléphone ou d’un navigateur à l’autre. Pour en garder une copie : « Exporter », « Copier la série », puis garde le texte dans un fichier ou dans un message WhatsApp à toi-même.": "They're kept in this device's browser, not online. They disappear if you clear the browser data or use private browsing, and they don't move from one phone or browser to another. To keep a copy: “Export”, “Copy the set”, then keep the text in a file or in a WhatsApp message to yourself.",
"Elles sont gardées dans le navigateur de cet appareil, pas en ligne. Elles disparaissent si tu vides les données du navigateur ou si tu utilises la navigation privée, et elles ne passent pas d'un téléphone ou d'un navigateur à l'autre. Pour en garder une copie : « Exporter », « Copier la série », puis garde le texte dans un fichier ou dans un message WhatsApp à toi-même.": "They're kept in this device's browser, not online. They disappear if you clear the browser data or use private browsing, and they don't move from one phone or browser to another. To keep a copy: “Export”, “Copy the set”, then keep the text in a file or in a WhatsApp message to yourself.",
"Activation et essai gratuit": "Activation and free trial",
"À la première ouverture, tu as 48 heures d’essai gratuit complet. Ensuite, un code d’activation est nécessaire. Reculer l’heure du téléphone pendant l’essai bloque l’appli : seul un code d’activation la débloque. Une fois l’appli activée, plus aucune vérification de l’heure n’est faite.": "When you first open it, you get a full 48-hour free trial. After that, an activation code is needed. Setting the phone's clock back during the trial locks the app: only an activation code unlocks it. Once the app is activated, the time is no longer checked.",
"À la première ouverture, tu as 48 heures d'essai gratuit complet. Ensuite, un code d'activation est nécessaire. Reculer l'heure du téléphone pendant l'essai bloque l'appli : seul un code d'activation la débloque. Une fois l'appli activée, plus aucune vérification de l'heure n'est faite.": "When you first open it, you get a full 48-hour free trial. After that, an activation code is needed. Setting the phone's clock back during the trial locks the app: only an activation code unlocks it. Once the app is activated, the time is no longer checked.",
"Le code d’activation ne marche que sur l’appareil pour lequel il a été généré. Si tu vides les données du navigateur ou si tu changes de téléphone, demande un nouveau code.": "The activation code only works on the device it was generated for. If you clear the browser data or change phones, ask for a new code.",
"Le code d'activation ne marche que sur l'appareil pour lequel il a été généré. Si tu vides les données du navigateur ou si tu changes de téléphone, demande un nouveau code.": "The activation code only works on the device it was generated for. If you clear the browser data or change phones, ask for a new code.",

"« Exporter », « Copier la série », puis envoie le texte (par WhatsApp par exemple). L'autre personne le colle dans « Importer ».": "“Export”, “Copy the set”, then send the text (by WhatsApp, for example). The other person pastes it into “Import”.",
"Les modes": "The modes",
"QCM libre : la correction s’affiche après chaque réponse. Examen : tu choisis la durée, la correction vient à la fin, tu peux changer de réponse, et il se termine tout seul quand le temps est écoulé. Erreurs : seulement les questions ratées la dernière fois. Exercices : tu fais l’exercice sur papier, tu affiches le corrigé et tu te notes.": "Free MCQ: the correction shows after each answer. Exam: you choose the duration, the correction comes at the end, you can change answers, and it ends by itself when time is up. Mistakes: only the questions missed last time. Exercises: you do the exercise on paper, show the solution and grade yourself.",
"QCM libre : la correction s'affiche après chaque réponse. Examen : tu choisis la durée, la correction vient à la fin, tu peux changer de réponse, et il se termine tout seul quand le temps est écoulé. Erreurs : seulement les questions ratées la dernière fois. Exercices : tu fais l'exercice sur papier, tu affiches le corrigé et tu te notes.": "Free MCQ: the correction shows after each answer. Exam: you choose the duration, the correction comes at the end, you can change answers, and it ends by itself when time is up. Mistakes: only the questions missed last time. Exercises: you do the exercise on paper, show the solution and grade yourself.",
"Exercices et réponses chiffrées": "Exercises and numerical answers",
"Quand la question attend un nombre, tape-le (virgule ou point) : l’appli accepte une petite marge d’arrondi. Les tableaux écrits avec le symbole | (une ligne par ligne du tableau) s’affichent en vrai tableau. Les graphiques demandés (courbes cumulatives, histogrammes, diagrammes circulaires…) sont dessinés dans le corrigé : trace le tien sur papier, compare, puis note-toi toi-même.": "When the question expects a number, type it (comma or dot): the app accepts a small rounding margin. Tables written with the | symbol (one line per table row) are shown as real tables. Requested graphs (cumulative curves, histograms, pie charts…) are drawn in the solution: draw yours on paper, compare, then grade yourself.",
"Quand la question attend un nombre, tape-le (virgule ou point) : l'appli accepte une petite marge d'arrondi. Les tableaux écrits avec le symbole | (une ligne par ligne du tableau) s'affichent en vrai tableau. Les graphiques demandés (courbes cumulatives, histogrammes, diagrammes circulaires…) sont dessinés dans le corrigé : trace le tien sur papier, compare, puis note-toi toi-même.": "When the question expects a number, type it (comma or dot): the app accepts a small rounding margin. Tables written with the | symbol (one line per table row) are shown as real tables. Requested graphs (cumulative curves, histograms, pie charts…) are drawn in the solution: draw yours on paper, compare, then grade yourself.",
"Reprendre plus tard": "Resume later",
"« Quitter et reprendre plus tard » garde ta progression : touche « Reprendre » sur l’accueil. Il n’y a qu’une session en cours à la fois : en lancer une nouvelle remplace l’ancienne. Dans un examen, le chrono continue même si tu quittes.": "“Quit and resume later” keeps your progress: tap “Resume” on the home screen. Only one session runs at a time: starting a new one replaces the old one. In an exam, the timer keeps running even if you leave.",
"« Quitter et reprendre plus tard » garde ta progression : touche « Reprendre » sur l'accueil. Il n'y a qu'une session en cours à la fois : en lancer une nouvelle remplace l'ancienne. Dans un examen, le chrono continue même si tu quittes.": "“Quit and resume later” keeps your progress: tap “Resume” on the home screen. Only one session runs at a time: starting a new one replaces the old one. In an exam, the timer keeps running even if you leave.",
"Hors ligne et installation": "Offline and installation",
"Après une première ouverture avec Internet, ScoreUp s’enregistre sur ton appareil et peut s’ouvrir sans connexion. Seule la lecture d’un PDF demande Internet. Pour l’avoir comme une appli : sur Android, menu du navigateur puis « Installer l’application » ; sur iPhone, bouton Partager puis « Sur l’écran d’accueil ».": "After a first opening with Internet, ScoreUp saves itself on your device and can open without a connection. Only reading a PDF needs Internet. To have it as an app: on Android, browser menu then “Install app”; on iPhone, Share button then “Add to Home Screen”.",
"Après une première ouverture avec Internet, ScoreUp s'enregistre sur ton appareil et peut s'ouvrir sans connexion. Seule la lecture d'un PDF demande Internet. Pour l'avoir comme une appli : sur Android, menu du navigateur puis « Installer l'application » ; sur iPhone, bouton Partager puis « Sur l'écran d'accueil ».": "After a first opening with Internet, ScoreUp saves itself on your device and can open without a connection. Only reading a PDF needs Internet. To have it as an app: on Android, browser menu then “Install app”; on iPhone, Share button then “Add to Home Screen”.",

"Import": "Import",
"L’appli vérifie le format et indique la ligne à corriger. Les doublons sont ignorés. Un PDF doit contenir du vrai texte : une photo ou un scan ne marche pas. Les questions et les choix sont mélangés si la case est cochée, donc la lettre de la bonne réponse change d’un essai à l’autre.": "The app checks the format and shows the line to fix. Duplicates are ignored. A PDF must contain real text: a photo or scan won't work. Questions and choices are shuffled if the box is ticked, so the correct answer's letter changes from one try to the next.",
"L'appli vérifie le format et indique la ligne à corriger. Les doublons sont ignorés. Un PDF doit contenir du vrai texte : une photo ou un scan ne marche pas. Les questions et les choix sont mélangés si la case est cochée, donc la lettre de la bonne réponse change d'un essai à l'autre.": "The app checks the format and shows the line to fix. Duplicates are ignored. A PDF must contain real text: a photo or scan won't work. Questions and choices are shuffled if the box is ticked, so the correct answer's letter changes from one try to the next.",

"Après une séance, touche « ⚔️ Défier un ami » : ton ami reçoit la série et ton score par WhatsApp, l’importe dans ScoreUp et tente de faire mieux.": "After a session, tap “⚔️ Challenge a friend”: your friend receives the set and your score on WhatsApp, imports it into ScoreUp and tries to do better.",
"Retrouve n’importe quelle question ou notion (par exemple « amortissement ») dans toutes tes séries.": "Find any question or notion (for example “depreciation”) in all your sets.",
"Dans « ⚙️ Réglages », active le mode édition pour corriger une question fausse, en ajouter ou en supprimer, sans supprimer toute la série.": "In “⚙️ Settings”, turn on edit mode to fix a wrong question, add or delete questions, without deleting the whole set.",
"5 séries de révision (chapitre 1) sont fournies pour tester ScoreUp : comptabilité, marketing, droit, management et statistiques, ainsi que 5 exercices corrigés de comptabilité (chapitres 1 et 2). Tu peux les supprimer, et ce bouton te les redonne.": "5 revision sets (chapter 1) are provided to try ScoreUp: accounting, marketing, law, management and statistics, plus 5 accounting exercises with solutions (chapters 1 and 2). You can delete them, and this button gives them back.",

"Les niveaux": "Levels",
"🆕 Nouveau : le bouton « Suivant » reste toujours visible, tu peux masquer les détails des corrigés et glisser pour passer à la question suivante. Et pour te motiver : points XP, niveaux, badges, objectif du jour et joker de série. Tout est expliqué dans le Guide.": "🆕 New: the “Next” button now stays visible, you can hide the details of the solutions and swipe to go to the next question. And to keep you motivated: XP points, levels, badges, a daily goal and a streak joker. Everything is explained in the Guide.",
"Pendant les QCM, le bouton « Suivant » reste toujours visible en bas de l’écran, et « Masquer les détails » replie l’explication. Glisse vers la gauche pour passer à la question suivante. Les options d’une question (corriger, modifier, signaler) sont réunies dans le bouton ⋯. Pour te motiver : points XP, niveaux, badges, objectif du jour, joker de série, calendrier de révision, maîtrise de chaque série et image de résultat à partager.": "During quizzes, the “Next” button always stays visible at the bottom of the screen, and “Hide details” folds the explanation away. Swipe left to go to the next question. A question's options (correct, edit, flag) are grouped in the ⋯ button. To keep you motivated: XP points, levels, badges, a daily goal, a streak joker, a revision calendar, mastery of each set and a result image to share.",
"Aussi dans ScoreUp": "Also in ScoreUp",
"Pendant les QCM": "During quizzes",
"Le bouton « Suivant » reste en bas de l’écran : plus besoin de descendre. Touche « Masquer les détails » pour replier l’explication et l’avertissement ; ton choix est gardé pour les prochaines séances. Tu peux aussi glisser vers la gauche pour passer à la question suivante, et vers la droite pour revenir en arrière en mode Examen. Le bouton ⋯ réunit « Corriger cette réponse », « Modifier toute la question » et « Signaler comme douteuse ». La barre du haut se colore : vert pour une bonne réponse, rouge pour une erreur.": "The “Next” button stays at the bottom of the screen: no more scrolling down. Tap “Hide details” to fold away the explanation and the warning; your choice is kept for the next sessions. You can also swipe left to go to the next question, and right to go back in Exam mode. The ⋯ button groups “Correct this answer”, “Edit the whole question” and “Flag as doubtful”. The top bar fills with colour: green for a correct answer, red for a mistake.",
"Sur ordinateur": "On a computer",
"Réponds avec les touches A, B, C, D (ou 1, 2, 3, 4), puis Entrée ou la flèche droite pour passer à la suite. La flèche gauche revient en arrière en mode Examen.": "Answer with the A, B, C, D keys (or 1, 2, 3, 4), then Enter or the right arrow to move on. The left arrow goes back in Exam mode.",
"XP, niveaux et badges": "XP, levels and badges",
"Chaque bonne réponse rapporte 10 XP. Une séance d’au moins 5 questions rapporte 20 XP de plus, et un sans-faute (10 questions ou plus) 50 XP. Enchaîne les bonnes réponses pour faire un combo : à partir de 5 d’affilée, tu gagnes un bonus. Les XP font monter ton niveau, de Débutant à Légende. Les badges récompensent ta régularité et tes exploits : retrouve-les dans le menu ☰, « Mes badges ».": "Each correct answer earns 10 XP. A session of at least 5 questions earns 20 XP more, and a flawless session (10 questions or more) 50 XP. Chain correct answers to build a combo: from 5 in a row, you earn a bonus. XP raises your level, from Beginner to Legend. Badges reward your consistency and achievements: find them in the ☰ menu, “My badges”.",
"Objectif du jour et joker": "Daily goal and joker",
"Choisis ton objectif dans les Réglages : 10, 20, 30 ou 50 questions par jour. L’anneau de l’accueil se remplit au fil de tes séances, et l’objectif atteint rapporte 30 XP. Le joker protège ta série de jours : si tu oublies un seul jour, ta série continue. Tu as un joker par semaine, utilisé automatiquement.": "Choose your goal in Settings: 10, 20, 30 or 50 questions a day. The ring on the home screen fills up with your sessions, and reaching the goal earns 30 XP. The joker protects your day streak: if you forget a single day, your streak continues. You get one joker per week, used automatically.",
"Résultat et partage": "Result and sharing",
"Après chaque séance : ta note dans un anneau, ta mention, un message quand tu bats ton record sur la série, et un filtre « Mes erreurs » pour ne relire que les questions ratées. « Partager mon résultat » crée une image à envoyer sur WhatsApp ou en statut.": "After each session: your grade in a ring, your mention, a message when you beat your record on the set, and a “My mistakes” filter to review only the questions you missed. “Share my result” creates an image to send on WhatsApp or post as a status.",
"Maîtrise et calendrier": "Mastery and calendar",
"Sur l’accueil, chaque série affiche sa maîtrise : la part de ses questions réussies au moins 3 fois de suite en révision espacée. Dans « Statistiques », le calendrier montre tes jours de révision des 12 dernières semaines.": "On the home screen, each set shows its mastery: the share of its questions answered correctly at least 3 times in a row in spaced revision. In “Statistics”, the calendar shows your revision days over the last 12 weeks.",

/* =====================================================================
   Copies de secours automatiques (même principe que Power Log)
   • À chaque modification, une copie est gardée sur ce téléphone, dans la base
     interne du navigateur (IndexedDB), sans Internet ni serveur : une par jour,
     sur les 14 derniers jours, plus les 5 dernières copies « avant » une
     restauration, un import ou un effacement.
   • Au démarrage, si les données principales ont disparu ou sont illisibles,
     l'appli les récupère seule depuis la dernière copie.

function TLSNAP(cfg){

    x.oncomplete=function(){db.close();res(out&&('result' in out)?out.result:out)};x.onerror=x.onabort=function(){db.close();rej(x.error)}})})}
  function get(k){return tx('readonly',function(st){return st.get(k)}).catch(function(){return null})}
  function keys(){return tx('readonly',function(st){return st.getAllKeys()}).catch(function(){return []})}
  function grab(){var m={};cfg.keys().forEach(function(k){try{var v=localStorage.getItem(k);if(v!=null)m[k]=v}catch(e){}});return m}
  function cnt(m){try{return +cfg.count(m)||0}catch(e){return 0}}
  function day(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  function starts(p){return function(k){return String(k).indexOf(p)===0}}
  function write(){clearTimeout(timer);timer=0;pending=false;var m=grab(),json=JSON.stringify(m);if(json===last)return Promise.resolve();last=json;
    var n=cnt(m),rec={t:Date.now(),data:m,n:n},dk='day:'+day();
    return keys().then(function(old){old=old.filter(starts('day:')).sort();var all=old.slice();if(n>0&&all.indexOf(dk)<0)all.push(dk);all.sort();var keep=all.slice(-DAYS);
      return tx('readwrite',function(st){st.put(rec,'latest');if(n>0)st.put(rec,dk);old.forEach(function(k){if(keep.indexOf(k)<0)st.delete(k)})})}).catch(function(){})}
  var api={
    /* à appeler après chaque enregistrement */
    soon:function(){pending=true;if(!ready)return;clearTimeout(timer);timer=setTimeout(write,1500)},
    flush:function(){if(ready&&pending)write()},
    /* copie « avant » une opération qui remplace ou efface les données (appel synchrone : la copie est prise tout de suite) */
    keep:function(kind){var m=grab(),n=cnt(m);if(!n)return Promise.resolve();
      return keys().then(function(old){old=old.filter(starts('pre:')).sort();return tx('readwrite',function(st){st.put({t:Date.now(),data:m,n:n,kind:kind},'pre:'+Date.now());old.slice(0,Math.max(0,old.length-PRE+1)).forEach(function(k){st.delete(k)})})}).catch(function(){})},
    list:function(){return keys().then(function(ks){return Promise.all(ks.filter(function(k){return k!=='latest'}).map(function(k){return get(k).then(function(r){return r&&r.data?{key:String(k),t:r.t,n:r.n||0,kind:starts('pre:')(k)?(r.kind||'restore'):'day'}:null})}))})
      .then(function(L){return L.filter(Boolean).sort(function(a,b){return b.t-a.t})})},
    /* remplace les données actuelles par une copie (les actuelles sont gardées dans « Avant restauration ») */
    restore:function(k){return get(k).then(function(r){if(!r||!r.data)return 'none';api.keep('restore');
      try{cfg.keys().forEach(function(x){if(!(x in r.data))localStorage.removeItem(x)});Object.keys(r.data).forEach(function(x){localStorage.setItem(x,r.data[x])})}catch(e){return 'full'}
      last=JSON.stringify(grab());return 'ok'})},
    /* au démarrage : données principales absentes ou illisibles → reprise de la dernière copie. Renvoie true si des données ont été récupérées. */
    heal:function(){var raw=null;try{raw=localStorage.getItem(cfg.main())}catch(e){ready=true;return Promise.resolve(false)}
      if(raw){try{JSON.parse(raw);last=JSON.stringify(grab());ready=true;if(pending)api.soon();return Promise.resolve(false)}catch(e){}}
      return get('latest').then(function(r){if(r&&r.data&&r.n>0)return r;return api.list().then(function(L){return L[0]?get(L[0].key):null})})
        .then(function(r){var ok=false;if(r&&r.data&&r.n>0){ok=true;Object.keys(r.data).forEach(function(x){try{localStorage.setItem(x,r.data[x])}catch(e){ok=false}})}
          last=JSON.stringify(grab());ready=true;if(pending)api.soon();return ok})}
  };
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')api.flush()});
  window.addEventListener('pagehide',function(){api.flush()});
  return api;
}

var DEMO=[{id:"demo-compta",name:"Comptabilité générale – Chapitre 1",cat:"Comptabilité",txt:`Q: Quel principe impose d’enregistrer chaque opération au débit d’un compte et au crédit d’un autre, pour le même montant ?
A) La prudence
B) La partie double
C) La continuité d’exploitation
D) L’annualité des exercices
R: B
E: Avec la partie double, tout débit a un crédit d’égal montant.

Q: Dans un bilan, que représente l’actif ?
A) Ce que l’entreprise possède et ce qu’on lui doit (ses emplois)
B) Ce que l’entreprise doit à ses créanciers et à ses associés
C) La différence entre les produits et les charges
D) Les ventes de l’année
R: A
E: L’actif regroupe les biens et les créances de l’entreprise. Le passif regroupe ses ressources : capitaux propres et dettes.

Q: Quelle égalité est toujours vérifiée dans un bilan ?
A) Actif = Charges + Produits
B) Passif = Résultat
C) Total de l’actif = Total du passif
D) Charges = Produits
R: C
E: Le bilan est toujours équilibré : les emplois sont financés par des ressources de même total.

Q: Une entreprise achète un véhicule de 20 000 000 et le règle par chèque bancaire. Quel est l’effet sur le total du bilan ?
A) Il augmente de 20 000 000
B) Il diminue de 20 000 000
C) Il double
D) Il ne change pas
R: D
E: Le véhicule (immobilisation) augmente et la banque diminue du même montant : le total reste identique.

Q: Une entreprise achète un véhicule de 20 000 000, à payer dans 60 jours. Quel est l’effet sur le bilan ?
A) Seul l’actif augmente
B) L’actif et le passif augmentent chacun de 20 000 000
C) Seul le passif augmente
D) Le bilan ne change pas
R: B
E: Le véhicule augmente l’actif et la dette envers le fournisseur augmente le passif.

Q: Que mesure le compte de résultat ?
A) La performance de l’entreprise sur une période, à partir des produits et des charges
B) Le patrimoine à une date donnée
C) Uniquement la trésorerie
D) Les dettes à long terme
R: A
E: Le bilan est une photo à une date donnée ; le compte de résultat est le film d’une période.

Q: Comment calcule-t-on le résultat net de l’exercice ?
A) Charges − Produits
B) Actif − Passif
C) Ventes − Stocks
D) Produits − Charges
R: D
E: Si les produits dépassent les charges, c’est un bénéfice ; dans le cas contraire, c’est une perte.

Q: Une entreprise emprunte 30 000 000 à une banque pour acheter un bâtiment. Que représente l’emprunt ?
A) Un emploi
B) Un produit
C) Une ressource
D) Une charge
R: C
E: L’emprunt est la ressource qui finance l’emploi (le bâtiment).

Q: Quel référentiel comptable s’applique aux entreprises du Sénégal et des autres pays de l’OHADA ?
A) Le plan comptable bancaire de la BCEAO
B) Le Plan comptable général français
C) Les normes comptables américaines (US GAAP)
D) Le SYSCOHADA révisé
R: D
E: L’Acte uniforme relatif au droit comptable impose le SYSCOHADA révisé, applicable depuis 2018.

Q: Dans le SYSCOHADA, à quoi correspond la classe 6 ?
A) Aux comptes de charges des activités ordinaires
B) Aux comptes de tiers
C) Aux comptes de produits des activités ordinaires
D) Aux comptes de trésorerie
R: A
E: La classe 6 enregistre les charges, la classe 7 les produits.

Q: Dans le SYSCOHADA, à quoi correspond la classe 4 ?
A) Aux comptes de stocks
B) Aux comptes de charges
C) Aux comptes d’immobilisations
D) Aux comptes de tiers (clients, fournisseurs, État…)
R: D
E: Exemples : 401 Fournisseurs, 411 Clients.

Q: Dans le SYSCOHADA, à quoi correspond la classe 5 ?
A) Aux comptes de trésorerie
B) Aux comptes de produits
C) Aux comptes de stocks
D) Aux comptes de ressources durables
R: A
E: Exemples : 521 Banques, 571 Caisse.

Q: Dans le SYSCOHADA, à quoi correspond la classe 2 ?
A) Aux comptes de tiers
B) Aux comptes d’actif immobilisé
C) Aux comptes de trésorerie
D) Aux comptes de charges
R: B
E: On y trouve les terrains, bâtiments, matériels, véhicules…

Q: Lors d’un achat de marchandises à crédit, quel compte est crédité ?
A) 411 Clients
B) 571 Caisse
C) 401 Fournisseurs
D) 601 Achats de marchandises
R: C
E: On débite 601 Achats de marchandises et on crédite 401 Fournisseurs, car l’entreprise a une dette envers lui.

Q: Lors d’une vente de marchandises payée en espèces, quel compte est crédité ?
A) 401 Fournisseurs
B) 601 Achats de marchandises
C) 701 Ventes de marchandises
D) 571 Caisse
R: C
E: On débite 571 Caisse (l’argent entre) et on crédite 701 Ventes de marchandises.

Q: Quel est le rôle du journal en comptabilité ?
A) Regrouper toutes les opérations par compte
B) Enregistrer les opérations dans l’ordre chronologique
C) Présenter le patrimoine en fin d’année
D) Calculer le résultat de l’exercice
R: B
E: Le journal est le livre d’enregistrement chronologique. Le grand livre regroupe les opérations par compte.

Q: Qu’est-ce que le grand livre ?
A) L’ensemble de tous les comptes de l’entreprise, avec leurs mouvements
B) La liste des clients
C) Le livre des procès-verbaux d’assemblée
D) Le document qui présente le bilan
R: A
E: Chaque écriture du journal est reportée dans les comptes du grand livre.

Q: À quoi sert la balance des comptes ?
A) À enregistrer les ventes du jour
B) À lister les comptes avec leurs totaux et soldes, et à vérifier l’égalité débit = crédit
C) À calculer l’impôt sur les sociétés
D) À peser les marchandises en stock
R: B
E: Si le total des débits n’est pas égal au total des crédits, il y a une erreur d’enregistrement.

Q: Comment augmente un compte d’actif, comme la Banque ?
A) Il ne peut jamais augmenter
B) Il augmente au crédit
C) Il augmente au débit
D) Il augmente seulement en fin d’année
R: C
E: Les comptes d’actif augmentent au débit et diminuent au crédit.

Q: Un compte a un total débit de 500 000 et un total crédit de 350 000. Quel est son solde ?
A) Un solde nul
B) Un solde créditeur de 150 000
C) Un solde débiteur de 850 000
D) Un solde débiteur de 150 000
R: D
E: Solde = 500 000 − 350 000 = 150 000. Le débit l’emporte, le solde est donc débiteur.`},
{id:"demo-marketing",name:"Fondements du marketing – Chapitre 1",cat:"Marketing",txt:`Q: Quelle définition du marketing est la plus juste ?
A) Identifier et satisfaire les besoins des clients de façon rentable
B) Faire de la publicité pour vendre plus
C) Fixer les prix les plus bas possible
D) Distribuer les produits en magasin
R: A
E: Le marketing ne se limite pas à la publicité ou à la vente : il part des besoins du client.

Q: Avoir soif est un besoin. Vouloir précisément une marque de boisson, c’est…
A) Une demande solvable
B) Un marché
C) Un désir
D) Une habitude
R: C
E: Le besoin est un manque ressenti ; le désir est la forme précise que ce besoin prend selon la culture et la personnalité.

Q: Qu’appelle-t-on la demande en marketing ?
A) Tous les besoins existants
B) Des désirs appuyés par un pouvoir d’achat
C) L’offre disponible sur le marché
D) Le nombre de concurrents
R: B
E: Sans pouvoir d’achat, un désir reste potentiel et ne devient pas une demande.

Q: Qu’est-ce qu’un marché au sens marketing ?
A) Uniquement un lieu physique de vente
B) L’ensemble des concurrents
C) Le stock d’une entreprise
D) L’ensemble des acheteurs actuels et potentiels d’un produit
R: D
E: Un marché désigne les clients, réels ou potentiels, qui ont un besoin et la capacité d’acheter.

Q: Quels sont les 4 P du marketing-mix traditionnel ?
A) Produit, Prix, Place (distribution), Promotion
B) Produit, Profit, Personnel, Publicité
C) Plan, Projet, Prix, Place
D) Prix, Public, Processus, Preuve
R: A
E: Ce sont les quatre leviers que l’entreprise combine pour agir sur son marché.

Q: Dans la pyramide de Maslow, quel besoin est le plus fondamental ?
A) L’estime
B) Les besoins physiologiques
C) L’accomplissement de soi
D) L’appartenance
R: B
E: Ordre : physiologiques, sécurité, appartenance, estime, accomplissement de soi.

Q: Lequel de ces facteurs est un facteur psychologique du comportement du consommateur ?
A) L’âge
B) La famille
C) La perception
D) La classe sociale
R: C
E: Facteurs psychologiques : motivation, perception, apprentissage, croyances et attitudes. L’âge est un facteur personnel ; la famille et la classe sociale sont des facteurs sociaux.

Q: Quelle est la première étape du processus d’achat ?
A) La décision d’achat
B) L’évaluation des solutions
C) Le comportement après l’achat
D) La reconnaissance du besoin
R: D
E: Le processus : reconnaissance du besoin, recherche d’informations, évaluation des solutions, décision d’achat, comportement après l’achat.

Q: Qu’est-ce que la segmentation du marché ?
A) Le choix du prix de vente
B) Le classement des concurrents par chiffre d’affaires
C) La fabrication du produit
D) Le découpage du marché en groupes de consommateurs aux besoins et comportements proches
R: D
E: Critères possibles : âge, revenu, lieu de vie, style de vie, usage du produit…

Q: Qu’appelle-t-on le ciblage ?
A) Le calcul de la part de marché
B) La négociation avec les fournisseurs
C) La création du logo
D) Le choix du ou des segments que l’entreprise décide de viser
R: D
E: Après la segmentation, l’entreprise choisit sa cible, puis son positionnement.

Q: Qu’est-ce que le positionnement ?
A) L’emplacement du produit sur l’étagère
B) La place que la marque veut occuper dans l’esprit des consommateurs par rapport aux concurrents
C) La position géographique du siège
D) Le nombre de points de vente
R: B
E: Exemple : se positionner comme la marque la moins chère, ou la plus innovante.

Q: Que signifient les quatre lettres de l’analyse SWOT ?
A) Forces, faiblesses, opportunités, menaces
B) Segmentation, web, organisation, tarif
C) Stratégie, ventes, offre, technique
D) Service, valeur, objectif, temps
R: A
E: SWOT vient de l’anglais : Strengths, Weaknesses, Opportunities, Threats.

Q: Dans une analyse SWOT, quels éléments sont internes à l’entreprise ?
A) Les opportunités uniquement
B) Les menaces uniquement
C) Les forces et les faiblesses
D) Les opportunités et les menaces
R: C
E: Opportunités et menaces viennent de l’environnement extérieur.

Q: Dans quel ordre se succèdent les phases du cycle de vie d’un produit ?
A) Lancement, croissance, maturité, déclin
B) Croissance, lancement, déclin, maturité
C) Lancement, déclin, croissance, maturité
D) Maturité, lancement, croissance, déclin
R: A
E: Les ventes sont faibles au lancement, augmentent, se stabilisent puis baissent.

Q: Qu’est-ce qu’une stratégie d’écrémage ?
A) Vendre uniquement en ligne
B) Supprimer les produits qui se vendent mal
C) Lancer un produit à un prix élevé pour toucher d’abord les clients prêts à payer cher
D) Lancer un produit à un prix très bas pour conquérir vite le marché
R: C
E: L’écrémage s’oppose au prix de pénétration.

Q: Qu’est-ce qu’un prix de pénétration ?
A) Le prix d’achat d’un produit au fournisseur
B) Un prix bas fixé pour gagner rapidement des parts de marché
C) Un prix élevé pour un produit de luxe
D) Un prix fixé par l’État
R: B
E: Il vise à attirer beaucoup de clients dès le lancement.

Q: Qu’est-ce qu’une distribution intensive ?
A) Une distribution dans le plus grand nombre possible de points de vente
B) Une distribution réservée à quelques boutiques choisies
C) Une vente uniquement dans les magasins de la marque
D) Une vente uniquement à l’étranger
R: A
E: Elle convient aux produits de consommation courante, comme l’eau ou le savon.

Q: Une entreprise réalise 50 millions de chiffre d’affaires sur un marché total de 400 millions. Quelle est sa part de marché ?
A) 20 %
B) 1,25 %
C) 8 %
D) 12,5 %
R: D
E: 50 ÷ 400 × 100 = 12,5 %.

Q: Quelle étude utilise un questionnaire auprès d’un grand échantillon pour obtenir des résultats chiffrés ?
A) Une étude qualitative
B) Une étude documentaire uniquement
C) Une étude quantitative
D) Un entretien individuel approfondi
R: C
E: L’étude qualitative cherche plutôt à comprendre les motivations, avec peu de personnes.

Q: Que désigne le marketing B to B ?
A) Le marketing des services publics
B) Le marketing entre entreprises
C) Le marketing des associations
D) Le marketing destiné aux particuliers
R: B
E: B to B = Business to Business. B to C = Business to Consumer, vers les particuliers.`},
{id:"demo-droit",name:"Introduction au droit – Chapitre 1",cat:"Droit",txt:`Q: Que désigne le droit objectif ?
A) Les prérogatives dont dispose une personne
B) Les décisions d’un seul juge
C) L’ensemble des règles qui organisent la vie en société
D) Les contrats entre particuliers
R: C
E: Le droit objectif est l’ensemble des règles obligatoires ; le droit subjectif est une prérogative reconnue à une personne.

Q: Comment appelle-t-on une prérogative reconnue à une personne, comme le droit de propriété ?
A) Un droit subjectif
B) Une sanction
C) Une personne morale
D) Une source du droit
R: A
E: Les droits subjectifs découlent des règles du droit objectif.

Q: Dans la hiérarchie des normes, quelle norme se situe au sommet ?
A) Le règlement
B) L’arrêté
C) La circulaire
D) La Constitution
R: D
E: Chaque norme doit respecter celles qui lui sont supérieures.

Q: Quelle source écrite du droit est votée par le Parlement ?
A) La coutume
B) La loi
C) La jurisprudence
D) La doctrine
R: B
E: La loi est une source écrite ; la coutume est une pratique répétée considérée comme obligatoire.

Q: Que désigne la jurisprudence ?
A) L’ensemble des décisions rendues par les juridictions
B) Les écrits des professeurs de droit
C) Les usages d’une profession
D) Les traités internationaux
R: A
E: Les écrits des juristes forment la doctrine, pas la jurisprudence.

Q: Qu’est-ce qu’une personne morale ?
A) Un être humain
B) Un bien meuble
C) Un groupement doté de la personnalité juridique, comme une société
D) Un contrat
R: C
E: Une personne morale peut posséder des biens, signer des contrats et agir en justice, comme une personne physique.

Q: À quel moment, en principe, une personne physique acquiert-elle la personnalité juridique ?
A) À sa majorité
B) À sa naissance (enfant né vivant)
C) À son mariage
D) À son premier emploi
R: B
E: La personnalité juridique commence à la naissance et s’achève avec le décès.

Q: Qu’est-ce qui distingue la règle de droit d’une simple règle morale ?
A) Elle est facultative
B) Elle ne concerne que les entreprises
C) Elle n’est jamais écrite
D) Elle est assortie d’une sanction imposée par l’État
R: D
E: La règle de droit est obligatoire et son non-respect peut être sanctionné.

Q: Que signifie le caractère général et impersonnel de la règle de droit ?
A) Elle change selon chaque individu
B) Elle s’applique à toutes les personnes qui sont dans la même situation, sans viser quelqu’un en particulier
C) Elle est écrite par une seule personne
D) Elle ne concerne que les dirigeants
R: B
E: C’est l’un des caractères de la règle de droit, avec son caractère obligatoire et sanctionné.

Q: Qu’est-ce que la coutume en droit ?
A) Un usage répété et ancien que les personnes considèrent comme obligatoire
B) Une loi votée récemment
C) Un livre écrit par un professeur de droit
D) Une décision d’un juge
R: A
E: La coutume est une source non écrite du droit.

Q: Que désigne la doctrine ?
A) Les usages commerciaux
B) Les lois votées par le Parlement
C) Les opinions et analyses des auteurs et professeurs de droit
D) Les décisions des tribunaux
R: C
E: La doctrine n’est pas obligatoire, mais elle influence les juges et le législateur.

Q: Laquelle de ces branches relève du droit privé ?
A) Le droit administratif
B) Le droit constitutionnel
C) Le droit fiscal
D) Le droit civil
R: D
E: Le droit privé régit les relations entre particuliers. Le droit constitutionnel, administratif et fiscal relèvent du droit public.

Q: Que régit le droit public ?
A) Uniquement les relations entre deux voisins
B) L’organisation de l’État et les relations dans lesquelles intervient une personne publique
C) Uniquement les contrats entre commerçants
D) Uniquement les relations familiales
R: B
E: Exemples : droit constitutionnel, droit administratif, finances publiques.

Q: Que signifie le principe de non-rétroactivité de la loi ?
A) En principe, une loi nouvelle ne s’applique qu’aux situations futures
B) Une loi n’est valable qu’un an
C) Une loi ne peut jamais être modifiée
D) Une loi s’applique à tous les faits passés
R: A
E: Ce principe protège la sécurité juridique. Il est très strict en matière pénale.

Q: Que signifie l’adage « Nul n’est censé ignorer la loi » ?
A) Chaque citoyen doit apprendre toutes les lois par cœur
B) Seuls les juristes doivent connaître la loi
C) Les lois sont secrètes
D) Personne ne peut échapper à l’application de la loi en disant qu’il ne la connaissait pas
R: D
E: Une fois publiée, la loi s’applique à tous.

Q: Qu’est-ce qu’une règle supplétive ?
A) Une règle à laquelle on ne peut jamais déroger
B) Une règle uniquement morale
C) Une règle qui s’applique seulement si les parties n’ont pas prévu autre chose
D) Une règle qui s’applique seulement aux mineurs
R: C
E: Elle s’oppose à la règle impérative, que les parties ne peuvent pas écarter.

Q: Qu’est-ce qu’un acte juridique ?
A) Un événement involontaire, comme un accident
B) Un article de journal
C) Une manifestation de volonté destinée à produire des effets de droit, comme un contrat
D) Une règle morale
R: C
E: Dans l’acte juridique, les effets de droit sont voulus par la personne.

Q: Lequel de ces exemples est un fait juridique ?
A) Un contrat de vente
B) Un accident de la circulation
C) Un testament
D) Un contrat de travail
R: B
E: Le fait juridique produit des effets de droit qui n’ont pas été recherchés, comme l’obligation de réparer le dommage.

Q: Selon la règle générale, qui doit prouver une obligation dont il réclame l’exécution ?
A) Celui qui réclame l’exécution
B) Le juge
C) Le greffier
D) Celui à qui on la réclame
R: A
E: La charge de la preuve pèse en principe sur celui qui allègue un fait ou réclame un droit.

Q: Quel est l’objectif principal de l’OHADA ?
A) Organiser les élections présidentielles
B) Créer une monnaie commune
C) Gérer les universités africaines
D) Harmoniser le droit des affaires entre ses États membres
R: D
E: L’OHADA a été créée par le traité de Port-Louis en 1993. Elle adopte des Actes uniformes.`},
{id:"demo-management",name:"Introduction au management – Chapitre 1",cat:"Management",txt:`Q: Quelle fonction du management consiste à fixer des objectifs et à définir les moyens de les atteindre ?
A) Le contrôle
B) La planification
C) La coordination
D) Le commandement
R: B
E: Planifier, c’est prévoir : on choisit les objectifs puis les moyens.

Q: Quelle structure repose sur une seule ligne d’autorité, chaque salarié n’ayant qu’un seul chef ?
A) La structure matricielle
B) La structure divisionnelle
C) La structure hiérarchique (linéaire)
D) La structure par projet
R: C
E: Dans la structure hiérarchique, les ordres descendent du sommet vers la base par une seule voie.

Q: Dans une structure matricielle, un salarié…
A) Dépend de deux responsables à la fois (fonctionnel et projet)
B) N’a aucun responsable
C) Ne travaille jamais en équipe
D) Dépend uniquement du directeur général
R: A
E: La matrice croise une autorité par fonction et une autorité par projet.

Q: Quelle fonction de l’entreprise s’occupe du recrutement, de la formation et de la paie ?
A) La fonction production
B) La fonction commerciale
C) La fonction financière
D) La fonction ressources humaines
R: D
E: La fonction ressources humaines gère le personnel de l’entreprise.

Q: Quelle fonction transforme des ressources en biens ou en services ?
A) La fonction financière
B) La fonction production
C) La fonction commerciale
D) La fonction ressources humaines
R: B
E: La production crée les biens et services que l’entreprise vend.

Q: Quel style de direction est celui d’un dirigeant qui décide seul et impose ses ordres ?
A) Autocratique
B) Démocratique
C) Laisser-faire
D) Bureaucratique
R: A
E: Le style autocratique concentre la décision ; le style démocratique associe l’équipe aux décisions.

Q: Dans le style de direction « laisser-faire », le dirigeant…
A) Décide de tout seul
B) Contrôle chaque tâche
C) Laisse beaucoup d’autonomie et intervient peu
D) Refuse toute délégation
R: C
E: Ce style convient à des équipes expérimentées, mais peut manquer de cadre.

Q: Qui a proposé les fonctions « prévoir, organiser, commander, coordonner, contrôler » ?
A) Maslow
B) Taylor
C) Porter
D) Fayol
R: D
E: Henri Fayol décrit ces fonctions de l’administration. Taylor est associé à l’organisation scientifique du travail.

Q: Qu’est-ce que l’efficience ?
A) Recruter le plus de salariés possible
B) Atteindre un objectif en utilisant le moins de ressources possible
C) Travailler le plus d’heures possible
D) Atteindre un objectif, quel que soit le coût
R: B
E: L’efficacité mesure l’atteinte de l’objectif. L’efficience ajoute la question des ressources utilisées.

Q: Quel auteur est associé à l’organisation scientifique du travail ?
A) Abraham Maslow
B) Elton Mayo
C) Frederick Taylor
D) Henry Mintzberg
R: C
E: Taylor propose de découper le travail en tâches simples, chronométrées et standardisées.

Q: Quel auteur a décrit le modèle de l’organisation bureaucratique, fondé sur des règles écrites et une hiérarchie ?
A) Max Weber
B) Peter Drucker
C) Frederick Taylor
D) Henri Fayol
R: A
E: Pour Weber, la bureaucratie est une forme d’organisation rationnelle et impersonnelle.

Q: Quel courant met en avant l’importance des relations humaines et de la motivation au travail, après les expériences de Hawthorne ?
A) Le fordisme
B) L’école des relations humaines (Elton Mayo)
C) L’organisation scientifique du travail
D) Le modèle bureaucratique
R: B
E: Les expériences de Hawthorne ont montré l’influence de l’attention portée aux salariés sur leur productivité.

Q: Que signifie un objectif SMART ?
A) Secret, mesuré, autorisé, rare et terminé
B) Stratégique, motivant, ambitieux, rentable et total
C) Simple, moderne, amusant, rapide et technique
D) Spécifique, mesurable, atteignable, réaliste et défini dans le temps
R: D
E: Exemple : augmenter les ventes de 10 % d’ici la fin du trimestre.

Q: Que désigne l’expression « parties prenantes » ?
A) Les acteurs concernés par l’activité de l’entreprise : clients, salariés, fournisseurs, État, etc.
B) Uniquement les concurrents
C) Les membres de la famille du dirigeant
D) Uniquement les actionnaires
R: A
E: L’entreprise doit tenir compte de leurs attentes, parfois opposées.

Q: Qu’est-ce que la délégation ?
A) Faire soi-même toutes les tâches
B) Licencier un salarié
C) Confier à un collaborateur une tâche et l’autorité nécessaire pour la réaliser
D) Organiser une élection syndicale
R: C
E: Le manager reste responsable du résultat final.

Q: En quoi consiste la fonction de contrôle en management ?
A) Comparer les résultats obtenus aux objectifs, puis corriger les écarts
B) Fixer le prix des produits
C) Choisir le logo de l’entreprise
D) Recruter de nouveaux salariés
R: A
E: Le contrôle boucle le processus : planifier, organiser, diriger, contrôler.

Q: Comment est organisée une structure divisionnelle ?
A) Uniquement par fonctions (production, vente, finance)
B) En divisions par produits, par marchés ou par zones géographiques
C) Sans aucune hiérarchie
D) Autour d’un seul chef sans aucun service
R: B
E: Chaque division fonctionne presque comme une petite entreprise.

Q: Qu’est-ce que le leadership ?
A) Le fait d’avoir le salaire le plus élevé
B) Le pouvoir de signer les chèques
C) Le fait d’être le plus ancien dans l’entreprise
D) La capacité à influencer, motiver et entraîner une équipe vers un objectif
R: D
E: Un leader n’est pas forcément le chef hiérarchique.

Q: Que désigne la culture d’entreprise ?
A) Le niveau de diplôme des salariés
B) Le chiffre d’affaires de l’entreprise
C) L’ensemble des valeurs, normes, habitudes et symboles partagés par les membres de l’entreprise
D) Les activités culturelles proposées le week-end
R: C
E: Elle influence la façon de travailler et de prendre les décisions.

Q: Qu’est-ce qu’un organigramme ?
A) Le plan des locaux
B) La liste des produits vendus
C) Le calendrier des congés
D) La représentation graphique de la structure et des liens hiérarchiques de l’entreprise
R: D
E: Il montre qui dépend de qui et comment les services sont organisés.`},
{id:"demo-stats",name:"Statistiques 1 – Chapitre 1",cat:"Statistiques",txt:`Q: Quelle est la moyenne de la série 2 ; 4 ; 4 ; 6 ; 9 ?
A) 4
B) 4,5
C) 5
D) 6
R: C
E: (2 + 4 + 4 + 6 + 9) ÷ 5 = 25 ÷ 5 = 5.

Q: Quelle est la médiane de la série 3 ; 7 ; 1 ; 9 ; 5 ; 11 ?
A) 5
B) 6
C) 7
D) 6,5
R: B
E: On range : 1 ; 3 ; 5 ; 7 ; 9 ; 11. Avec 6 valeurs, on prend la moyenne des deux valeurs centrales : (5 + 7) ÷ 2 = 6.

Q: Quel est le mode de la série 5 ; 3 ; 5 ; 8 ; 3 ; 5 ; 9 ?
A) 3
B) 8
C) 9
D) 5
R: D
E: Le mode est la valeur la plus fréquente : 5 apparaît 3 fois.

Q: Quelle est la variance de la série 2 ; 4 ; 4 ; 6 ; 9 (formule de la statistique descriptive, division par n) ?
A) 5,6
B) 7
C) 28
D) 5
R: A
E: Moyenne 5. Écarts au carré : 9 ; 1 ; 1 ; 1 ; 16, soit 28 au total. Variance = 28 ÷ 5 = 5,6.

Q: Une série a une variance de 16. Quel est son écart-type ?
A) 8
B) 16
C) 4
D) 256
R: C
E: L’écart-type est la racine carrée de la variance : √16 = 4.

Q: Comment définit-on la variance ?
A) Le carré de la moyenne
B) La moyenne des carrés des écarts à la moyenne
C) La somme des écarts à la moyenne
D) La différence entre la plus grande et la plus petite valeur
R: B
E: La somme des écarts à la moyenne est toujours nulle, d’où l’usage des carrés. La différence max − min est l’étendue.

Q: On ajoute 10 à chaque valeur d’une série. Que deviennent la moyenne et l’écart-type ?
A) La moyenne augmente de 10, l’écart-type ne change pas
B) La moyenne et l’écart-type augmentent de 10
C) La moyenne ne change pas, l’écart-type augmente de 10
D) La moyenne et l’écart-type sont multipliés par 10
R: A
E: Une translation déplace la série sans modifier sa dispersion.

Q: Deux séries ont la même moyenne (50). La première a un écart-type de 5, la seconde de 12. Laquelle est la plus dispersée ?
A) La première
B) Elles sont aussi dispersées
C) On ne peut pas savoir
D) La seconde
R: D
E: Plus l’écart-type est grand, plus les valeurs s’éloignent de la moyenne.

Q: Qu’est-ce qu’un échantillon en statistique ?
A) L’ensemble de la population
B) Le résultat d’un calcul de moyenne
C) Une partie de la population, sur laquelle porte l’étude
D) Un graphique
R: C
E: On étudie souvent un échantillon quand interroger toute la population est trop coûteux.

Q: Laquelle de ces variables est qualitative ?
A) Le nombre d’enfants
B) La situation matrimoniale
C) Le salaire mensuel
D) La taille en centimètres
R: B
E: Une variable qualitative a des modalités qui ne sont pas des nombres : célibataire, marié(e)…

Q: Laquelle de ces variables est quantitative discrète ?
A) La couleur des yeux
B) La durée d’un trajet
C) Le nombre d’enfants d’une famille
D) La taille d’une personne
R: C
E: Une variable discrète prend des valeurs isolées (0, 1, 2…). La taille et la durée sont continues.

Q: Dans un groupe de 48 étudiants, 12 viennent en bus. Quelle est la fréquence de cette modalité ?
A) 0,12, soit 12 %
B) 4
C) 0,25, soit 25 %
D) 0,4, soit 40 %
R: C
E: Fréquence = effectif ÷ effectif total = 12 ÷ 48 = 0,25.

Q: Quelle est l’étendue de la série 3 ; 8 ; 15 ; 4 ?
A) 7,5
B) 15
C) 11
D) 12
R: D
E: Étendue = valeur maximale − valeur minimale = 15 − 3 = 12.

Q: Un étudiant a 10 (coefficient 2) et 16 (coefficient 1). Quelle est sa moyenne pondérée ?
A) 12
B) 13
C) 10
D) 14
R: A
E: (10 × 2 + 16 × 1) ÷ (2 + 1) = 36 ÷ 3 = 12.

Q: Que donne l’effectif cumulé croissant d’une valeur ?
A) Le nombre d’observations inférieures ou égales à cette valeur
B) La moyenne de la série
C) Le nombre d’observations supérieures à cette valeur
D) La valeur la plus fréquente
R: A
E: On additionne les effectifs depuis la première valeur jusqu’à celle étudiée.

Q: Dans un diagramme circulaire, quel angle correspond à une modalité de fréquence 25 % ?
A) 45°
B) 90°
C) 25°
D) 180°
R: B
E: 25 % de 360° = 90°.

Q: Quel graphique convient à une variable continue regroupée en classes ?
A) Le diagramme en bâtons
B) La carte géographique
C) Le diagramme circulaire uniquement
D) L’histogramme
R: D
E: Dans un histogramme, les rectangles sont collés et leur surface est proportionnelle à l’effectif.

Q: Quel est le centre de la classe [10 ; 20[ ?
A) 30
B) 15
C) 20
D) 10
R: B
E: Centre = (10 + 20) ÷ 2 = 15.

Q: Lequel de ces indicateurs est le moins sensible aux valeurs extrêmes ?
A) La moyenne
B) L’étendue
C) La variance
D) La médiane
R: D
E: Une valeur très grande ou très petite modifie la moyenne, mais presque pas la médiane.

Q: Que représente le premier quartile (Q1) ?
A) La plus petite valeur telle qu’au moins 25 % des observations lui sont inférieures ou égales
B) La plus petite valeur de la série
C) La moitié de la moyenne
D) La valeur la plus fréquente
R: A
E: Q1, la médiane et Q3 partagent la série ordonnée en quatre parts d’effectifs à peu près égaux.`},
{id:"demo-compta-ex",name:"Comptabilité générale – Exercices (chap. 1 et 2)",cat:"Comptabilité",kind:"ex",txt:`EX: Exercice 1 – Analyse des flux (chapitre 1)
Analyse les opérations suivantes. Les montants sont en milliers de francs.
Pour chaque opération, indique la ressource (l’origine du flux) et l’emploi (sa destination), avec le numéro de compte SYSCOHADA.
N° | Opération | Montant
1 | Achat d’un terrain par chèque bancaire | 28 000
2 | Achat de mobilier de bureau à crédit | 4 000
3 | Achat d’une imprimante payée par caisse | 1 400
4 | Vente de marchandises au client Diop, paiement ultérieur | 2 400
5 | Achat de marchandises à crédit au fournisseur Raoul | 3 200
6 | Paiement par chèque des intérêts du mois sur l’emprunt | 6 500
7 | Paiement des salaires du mois par chèque | 4 240
8 | Paiement de l’assurance par chèque | 1 120
9 | Vente de produits finis payée par chèque | 2 800
10 | Achat de marchandises au fournisseur Camara payé par chèque | 6 000
11 | Vente au comptant de marchandises au client Obiang, payée en espèces | 1 500
Q: Pour les opérations 1, 2 et 3, indique la ressource et l’emploi, avec les numéros de compte.
C: Opération | Ressource | Emploi
1 | Banque (521) | Terrains (22)
2 | Fournisseurs d’investissements (481) | Mobilier de bureau (2444)
3 | Caisse (571) | Matériel et mobilier de bureau (244)
Astuce : demande-toi « d’où vient la valeur ? » (ressource) et « à quoi sert-elle ? » (emploi). Un achat d’immobilisation à crédit crée une dette envers un fournisseur d’investissements (481), pas envers un fournisseur ordinaire (401).
Q: Pour les opérations 4 et 5, indique la ressource et l’emploi, avec les numéros de compte.
C: Opération | Ressource | Emploi
4 | Ventes de marchandises (701) | Clients (411)
5 | Fournisseurs d’exploitation (401) | Achats de marchandises (601)
Une vente à crédit crée une créance sur le client (411) ; un achat de marchandises à crédit crée une dette envers le fournisseur d’exploitation (401).
Q: Pour les opérations 6, 7 et 8, indique la ressource et l’emploi, avec les numéros de compte.
C: Opération | Ressource | Emploi
6 | Banque (521) | Intérêts des emprunts (671)
7 | Banque (521) | Personnel, rémunérations dues (422)
8 | Banque (521) | Primes d’assurance (625)
Dans les trois cas, l’argent sort de la banque : la banque est la ressource.
Q: Pour les opérations 9, 10 et 11, indique la ressource et l’emploi, avec les numéros de compte.
C: Opération | Ressource | Emploi
9 | Ventes de produits finis (702) | Banque (521)
10 | Banque (521) | Achats de marchandises (601)
11 | Ventes de marchandises (701) | Caisse (571)
Lors d’une vente, la ressource est la vente elle-même (compte 70…) et l’emploi est l’endroit où arrive l’argent ou la créance (banque, caisse ou client).
Q: Quel est le montant total, en milliers de francs, des sommes sorties de la banque (opérations payées par chèque) ?
N: 45860
C: Les opérations payées par chèque sont la 1, la 6, la 7, la 8 et la 10.
28 000 + 6 500 + 4 240 + 1 120 + 6 000 = 45 860 (milliers de francs).
L’opération 9 n’en fait pas partie : le chèque est reçu, l’argent entre en banque.
Q: Pour l’opération 11, décris le flux réel et le flux monétaire (origine, destination, montant). Ces flux sont-ils internes ou externes ?
C: Flux | Origine | Destination | Montant
Flux réel (marchandises) | Entreprise | Client Obiang | 1 500
Flux monétaire (espèces) | Client Obiang | Entreprise (caisse) | 1 500
Ce sont deux flux externes : ils ont lieu entre l’entreprise et un tiers. Comme le dit le cours, les flux externes sont opposés et de valeurs égales.

EX: Exercice 2 – Patrimoine et situation nette (chapitre 2)
Au 31/12/2020, le patrimoine de l’entreprise IMPORT SARL comprend les éléments suivants :
Élément | Montant (F)
Un bâtiment | 9 000 000
Un terrain | 6 000 000
Un véhicule | 4 000 000
Une machine | 2 500 000
Un mobilier | 2 000 000
Un compte en banque | 3 600 000
Une créance sur les clients | 1 200 000
Espèces en caisse | 300 000
Somme due à l’État | 450 000
Somme due aux fournisseurs | 1 500 000
Somme due à la banque (emprunt) | 5 000 000
Q: Quel est le total des biens de l’entreprise (en francs) ?
N: 27400000
C: Les biens sont ce que l’entreprise possède. La créance sur les clients n’est pas un bien : c’est une créance, on la compte à part.
Bien | Montant
Bâtiment | 9 000 000
Terrain | 6 000 000
Véhicule | 4 000 000
Machine | 2 500 000
Mobilier | 2 000 000
Compte bancaire | 3 600 000
Espèces en caisse | 300 000
Total des biens | 27 400 000
Q: Quel est le total des dettes de l’entreprise (en francs) ?
N: 6950000
C: Dette | Montant
État | 450 000
Fournisseurs | 1 500 000
Emprunt bancaire | 5 000 000
Total des dettes | 6 950 000
Q: Quelle est la situation nette de l’entreprise (en francs) ?
N: 21650000
C: Situation nette = (biens + créances) – dettes
= 27 400 000 + 1 200 000 – 6 950 000 = 21 650 000 F.
La situation nette est positive : ce que l’entreprise possède et ce qu’on lui doit dépasse ce qu’elle doit.

EX: Exercice 3 – Le magasin de M. Sène (chapitre 2)
Le 1er juillet de l’année N, M. Sène ouvre un magasin de vente en gros. Trois mois après le démarrage de son activité, les éléments suivants ont été recensés :
Élément | Montant (F)
Un hangar | 400 000
Des installations | 250 000
Un réfrigérateur | 300 000
Une encaisse | 100 000
Un dépôt en banque | 150 000
Des créances sur les clients | 150 000
Un stock de marchandises | 700 000
Une dette envers son banquier, payable dans 3 ans | 600 000
Une dette envers ses fournisseurs | 200 000
Son apport au démarrage était de 1 000 000 F.
Q: Quel est le montant total des ressources extérieures (dettes) dont M. Sène a disposé (en francs) ? Donne aussi leur appellation comptable.
N: 800000
C: Ressource extérieure | Appellation comptable | Montant
Dette envers le banquier (3 ans) | Emprunts (16) | 600 000
Dette envers les fournisseurs | Fournisseurs (401) | 200 000
Total | – | 800 000
Q: Quel est le montant total des emplois (en francs) ? Donne l’appellation comptable de chaque emploi.
N: 2050000
C: Emploi | Appellation comptable | Montant
Hangar | Bâtiments (23) | 400 000
Installations | Installations et agencements (23) | 250 000
Réfrigérateur | Matériel (24) | 300 000
Stock de marchandises | Marchandises (31) | 700 000
Créances sur les clients | Clients (411) | 150 000
Dépôt en banque | Banque (521) | 150 000
Encaisse | Caisse (571) | 100 000
Total des emplois | – | 2 050 000
Q: Quel est le montant des capitaux propres et ressources assimilées à la fin de la période (en francs) ?
N: 1250000
C: Les capitaux propres sont ce qui reste quand on retire les dettes de l’ensemble des emplois.
Capitaux propres = total des emplois – dettes = 2 050 000 – 800 000 = 1 250 000 F.
Q: Sachant que son apport était de 1 000 000 F, quel est le résultat réalisé à la fin du trimestre (en francs) ? Est-ce un bénéfice ou une perte ?
N: 250000
C: Résultat net = (biens + créances) – (capital + dettes)
= 2 050 000 – (1 000 000 + 800 000) = 250 000 F.
Le résultat est positif : c’est un bénéfice de 250 000 F.
Autre façon de le voir : capitaux propres – apport = 1 250 000 – 1 000 000 = 250 000 F.
Q: Présente le bilan de M. Sène au 30 septembre de l’année N.
C: Bilan au 30 septembre N
Actif | Montant | Passif | Montant
Bâtiments – hangar (23) | 400 000 | Capital (10) | 1 000 000
Installations et agencements (23) | 250 000 | Résultat net : bénéfice (131) | 250 000
Matériel – réfrigérateur (24) | 300 000 | Emprunts (16) | 600 000
Marchandises (31) | 700 000 | Fournisseurs (401) | 200 000
Clients (411) | 150 000 | – | –
Banque (521) | 150 000 | – | –
Caisse (571) | 100 000 | – | –
Total actif | 2 050 000 | Total passif | 2 050 000
À l’actif : l’actif immobilisé (bâtiments, installations, matériel), l’actif circulant (marchandises, clients) puis la trésorerie-actif (banque, caisse). Au passif : les capitaux propres (capital et résultat), puis les dettes (emprunts, fournisseurs). Le bilan est équilibré : total actif = total passif.

EX: Exercice 4 – Postulats et conventions comptables (chapitre 1)
Pour chaque situation, indique le postulat ou la convention comptable qui s’applique, et explique-le en une phrase.
Q: L’entreprise utilise un camion en crédit-bail. Elle n’en est pas encore propriétaire, mais elle l’inscrit à l’actif de son bilan.
C: Postulat de la prééminence de la réalité économique sur l’apparence juridique. Juridiquement, le camion appartient encore au bailleur, mais économiquement c’est l’entreprise qui l’utilise et en tire les avantages : il est donc inscrit à l’actif du preneur (locataire).
Q: Un client qui doit 500 000 F à l’entreprise est en grandes difficultés financières. L’entreprise tient compte de cette perte probable. En revanche, elle n’enregistre pas le gain qu’elle espère d’un procès qu’elle pense gagner.
C: Convention de prudence. Elle oblige à tenir compte des pertes latentes, même si elles ne sont pas absolument certaines, et refuse la prise en compte des produits latents (gains seulement espérés).
Q: Une machine achetée 2 500 000 F vaudrait aujourd’hui 3 000 000 F sur le marché. Pour quel montant (en francs) doit-elle être inscrite dans les comptes ?
N: 2500000
C: Convention du coût historique : un actif acquis à titre onéreux est enregistré à son coût d’acquisition, soit 2 500 000 F. La plus-value espérée de 500 000 F n’est pas enregistrée (c’est aussi une application de la prudence : pas de produit latent).
Q: Le 28 décembre N, l’entreprise établit une facture de vente. Le client ne paiera qu’en février N+1. À quel moment la vente doit-elle être enregistrée ?
C: Postulat de la comptabilité d’engagement : l’opération est enregistrée au moment où la facture est établie, donc en décembre N, et non au moment du paiement. Avec le postulat de la spécialisation des exercices, cette vente est rattachée à l’exercice N.
Q: Le propriétaire d’une entreprise individuelle paie le loyer de sa maison familiale avec son argent personnel. Le comptable n’enregistre pas cette dépense dans les comptes de l’entreprise.
C: Postulat de l’entité : l’entreprise est considérée comme une entité autonome, distincte de son propriétaire. Les dépenses personnelles du propriétaire ne concernent pas la comptabilité de l’entreprise.
Q: Chaque année, l’entreprise change de méthode pour évaluer ses stocks, si bien qu’on ne peut plus comparer ses comptes d’une année à l’autre. Quel postulat n’est pas respecté ?
C: Postulat de la permanence des méthodes : les règles comptables et la structure des comptes doivent rester constantes pour permettre les comparaisons dans le temps et dans l’espace.
Q: Le bilan d’ouverture au 1er janvier N+1 reprend exactement les montants du bilan de clôture au 31 décembre N.
C: Convention de la correspondance bilan de clôture – bilan d’ouverture : le bilan d’ouverture d’un exercice N+1 doit correspondre au bilan de clôture de l’exercice N.

EX: Exercice 5 – La boutique de Mlle Diallo (chapitre 2)
Mlle Diallo a ouvert une boutique de cosmétiques avec un apport (capital) de 1 100 000 F. À la fin de l’exercice, elle recense les éléments suivants :
Élément | Montant (F)
Mobilier | 350 000
Matériel informatique | 450 000
Stock de marchandises | 600 000
Créances sur les clients | 120 000
Compte en banque | 230 000
Espèces en caisse | 50 000
Dettes envers les fournisseurs | 380 000
Emprunt bancaire sur 2 ans | 500 000
Impôts dus à l’État | 70 000
Q: Quel est le total des biens et créances (en francs) ?
N: 1800000
C: 350 000 + 450 000 + 600 000 + 120 000 + 230 000 + 50 000 = 1 800 000 F.
Q: Quel est le total des dettes (en francs) ?
N: 950000
C: Fournisseurs 380 000 + emprunt 500 000 + État 70 000 = 950 000 F.
Q: Quelle est la situation nette (en francs) ?
N: 850000
C: Situation nette = (biens + créances) – dettes = 1 800 000 – 950 000 = 850 000 F.
Q: L’exercice se termine-t-il par un bénéfice ou par une perte ? De quel montant (en francs) ?
N: 250000
C: Capital + dettes = 1 100 000 + 950 000 = 2 050 000 F. C’est plus que les biens et créances (1 800 000 F) : l’exercice se termine par une perte.
Perte nette = (capital + dettes) – (biens + créances) = 2 050 000 – 1 800 000 = 250 000 F.
Vérification : situation nette 850 000 = capital 1 100 000 – perte 250 000.
Q: Présente le bilan de fin d’exercice de Mlle Diallo.
C: Actif | Montant | Passif | Montant
Mobilier (244) | 350 000 | Capital (10) | 1 100 000
Matériel informatique (244) | 450 000 | Résultat net : perte (139) | – 250 000
Marchandises (31) | 600 000 | Emprunts (16) | 500 000
Clients (411) | 120 000 | Fournisseurs (401) | 380 000
Banque (521) | 230 000 | État (44) | 70 000
Caisse (571) | 50 000 | – | –
Total actif | 1 800 000 | Total passif | 1 800 000
La perte se place au passif, dans les capitaux propres, avec un signe moins : elle diminue les capitaux propres (1 100 000 – 250 000 = 850 000 F). Rappel du cours : bénéfice net et perte nette ne figurent jamais ensemble dans un même bilan.`}];
var SCHOOL_SETS=[{id:"droit-personnes",school:"droit",name:"Droit civil – Les personnes",cat:"Droit civil",txt:`Q: Qu’est-ce que la personnalité juridique ?
A) Le droit de voter aux élections
B) Le caractère d’une personne, tel qu’on le perçoit en société
C) La capacité de signer seul un contrat commercial
D) L’aptitude à être titulaire de droits et d’obligations
R: D
E: Toute personne, physique ou morale, a la personnalité juridique : elle peut avoir des droits et des obligations.

Q: En principe, à quel moment commence la personnalité juridique d’une personne physique ?
A) À l’inscription sur les listes électorales
B) À la majorité
C) À la conception
D) À la naissance, si l’enfant naît vivant et viable
R: D
E: La personnalité juridique commence à la naissance, à condition que l’enfant naisse vivant et viable.

Q: Que signifie l’adage « l’enfant conçu est considéré comme né chaque fois qu’il y va de son intérêt » ?
A) L’enfant à naître peut acquérir des droits, par exemple hériter, s’il naît ensuite vivant et viable
B) L’enfant à naître peut être poursuivi en justice
C) L’enfant à naître a les mêmes obligations qu’un adulte
D) L’enfant devient majeur dès sa conception
R: A
E: C’est une exception favorable : la personnalité est rétroactivement accordée dès la conception, seulement dans l’intérêt de l’enfant.

Q: À quel moment prend fin la personnalité juridique d’une personne physique ?
A) Au placement sous tutelle
B) À la retraite
C) Au décès
D) À la perte de la nationalité
R: C
E: La personnalité juridique s’éteint avec la mort de la personne.

Q: Lequel de ces exemples est une personne morale ?
A) Un étudiant étranger
B) Une société commerciale immatriculée
C) Un majeur sous tutelle
D) Un enfant mineur
R: B
E: Les personnes morales sont des groupements (sociétés, associations, État…) dotés de la personnalité juridique.

Q: Lequel de ces éléments sert à identifier une personne physique ?
A) Le capital social
B) Le chiffre d’affaires
C) Le siège social
D) Le nom
R: D
E: Le nom, le domicile et l’état civil identifient une personne physique. Le siège social et le capital concernent les sociétés.

Q: Qu’est-ce que le domicile d’une personne ?
A) N’importe quel endroit où elle passe une nuit
B) Le lieu où elle est née
C) Le lieu de son principal établissement, auquel la loi la rattache
D) Le lieu où elle travaille, obligatoirement
R: C
E: Le domicile est le lieu de rattachement juridique. La résidence est un simple lieu d’habitation de fait.

Q: Lequel de ces documents n’est PAS un acte de l’état civil ?
A) Un acte de naissance
B) Un contrat de bail
C) Un acte de mariage
D) Un acte de décès
R: B
E: Les actes de l’état civil constatent les grands événements de la vie : naissance, mariage, décès.

Q: Que signifie l’incapacité d’exercice ?
A) La personne ne peut pas hériter
B) La personne n’a aucun droit
C) La personne ne peut pas être propriétaire
D) La personne a des droits mais ne peut pas les exercer seule
R: D
E: L’incapable d’exercice garde ses droits (capacité de jouissance) mais doit être représenté ou assisté pour les exercer.

Q: Qui représente en principe un mineur non émancipé dans les actes de la vie civile ?
A) Ses parents ou son tuteur
B) Son professeur principal
C) Le maire de sa commune
D) Le procureur de la République
R: A
E: Le mineur non émancipé est représenté par ses parents (ou par un tuteur s’ils ne peuvent pas exercer ce rôle).

Q: Quel est l’effet principal de l’émancipation d’un mineur ?
A) Il devient automatiquement majeur sur le plan électoral
B) Il devient capable, comme un majeur, d’accomplir les actes de la vie civile
C) Il perd sa nationalité
D) Il ne peut plus hériter de ses parents
R: B
E: L’émancipation donne au mineur la capacité d’exercice d’un majeur pour les actes de la vie civile, sauf exceptions prévues par la loi.

Q: À quel âge est fixée la majorité civile au Sénégal ?
A) 25 ans
B) 18 ans
C) 16 ans
D) 21 ans
R: B
E: Au Sénégal, comme dans la plupart des pays, on est majeur à 18 ans accomplis.

Q: Lequel de ces droits est un droit de la personnalité ?
A) Le droit au respect de la vie privée
B) Le droit de propriété sur une maison
C) Le droit de créance
D) Le droit d’usufruit
R: A
E: Les droits de la personnalité protègent la personne elle-même : vie privée, image, honneur, intégrité physique.

Q: Pourquoi dit-on que les droits de la personnalité sont extrapatrimoniaux ?
A) Ils ne sont pas évaluables en argent et ne peuvent pas être vendus
B) Ils appartiennent uniquement aux sociétés
C) Ils se transmettent automatiquement aux héritiers
D) Ils peuvent être cédés à un tiers contre rémunération
R: A
E: Ils sont hors commerce : on ne peut ni les vendre ni les céder, même si leur atteinte peut donner lieu à des dommages-intérêts.

Q: Que signifie le principe d’immutabilité du nom ?
A) Le nom change à chaque mariage obligatoirement
B) Chacun choisit son nom à sa majorité
C) On ne peut pas changer de nom librement, sauf procédure prévue par la loi
D) Le nom peut être vendu
R: C
E: Le nom est en principe fixe. Un changement n’est possible que dans les cas et selon la procédure prévus par la loi.

Q: Selon le droit OHADA, à partir de quand une société commerciale acquiert-elle la personnalité juridique ?
A) Au premier bilan approuvé
B) Dès la première vente réalisée
C) À son immatriculation au Registre du commerce et du crédit mobilier (RCCM)
D) À la signature des statuts
R: C
E: La société n’a la personnalité morale qu’à partir de son immatriculation au RCCM.

Q: Qu’est-ce que le patrimoine d’une personne ?
A) Uniquement son compte en banque
B) L’ensemble de ses diplômes
C) Uniquement ses biens immobiliers
D) L’ensemble de ses biens et de ses obligations évaluables en argent
R: D
E: Le patrimoine comprend un actif (biens, créances) et un passif (dettes).

Q: Selon la théorie classique du patrimoine (Aubry et Rau), quelle affirmation est juste ?
A) Seules les personnes riches ont un patrimoine
B) Une personne peut avoir autant de patrimoines qu’elle le souhaite
C) Toute personne a nécessairement un patrimoine, et un seul
D) Le patrimoine peut exister sans aucune personne titulaire
R: C
E: La théorie classique lie le patrimoine à la personne : pas de personne sans patrimoine, pas de patrimoine sans personne.

Q: Quelle situation correspond à une disparition au sens juridique ?
A) Une personne est partie en voyage depuis un mois
B) Une personne a disparu dans un naufrage et son corps n’a pas été retrouvé
C) Une personne refuse de répondre au téléphone
D) Une personne a déménagé sans donner sa nouvelle adresse
R: B
E: La disparition suppose des circonstances qui mettent la vie en danger. La simple absence de nouvelles relève de l’absence.

Q: Quel est le but des régimes de protection des majeurs (tutelle, curatelle) ?
A) Protéger un majeur dont les facultés sont altérées
B) Permettre à un mineur de voter
C) Retirer la nationalité d’une personne
D) Punir un majeur qui a commis une infraction
R: A
E: Ces régimes protègent la personne majeure qui ne peut plus pourvoir seule à ses intérêts.`},
{id:"droit-constit",school:"droit",name:"Droit constitutionnel – L’État et la Constitution",cat:"Droit constitutionnel",txt:`Q: Quels sont les trois éléments constitutifs de l’État ?
A) Une monnaie, une armée et un drapeau
B) Une religion, une langue et une capitale
C) Une population, un territoire et un pouvoir politique souverain
D) Un président, un parlement et une constitution
R: C
E: La doctrine classique retient trois éléments : population, territoire, pouvoir politique organisé et souverain.

Q: Lequel de ces pays est un État fédéral ?
A) Le Sénégal
B) Le Nigeria
C) La Côte d’Ivoire
D) Le Mali
R: B
E: Dans un État fédéral, le pouvoir est partagé entre l’État fédéral et des États fédérés. Le Sénégal est un État unitaire.

Q: Que désigne la souveraineté de l’État ?
A) La richesse économique de l’État
B) Le pouvoir du roi uniquement
C) Un pouvoir suprême qui ne dépend d’aucun autre pouvoir
D) La taille de son territoire
R: C
E: L’État souverain n’est soumis à aucune autorité supérieure, à l’intérieur comme à l’extérieur.

Q: Que désigne la Constitution au sens matériel ?
A) La liste des lois votées dans l’année
B) Le règlement intérieur de l’Assemblée nationale
C) Uniquement le texte officiel intitulé « Constitution »
D) L’ensemble des règles relatives à l’organisation et au fonctionnement des pouvoirs publics, quelle que soit leur forme
R: D
E: Le sens matériel regarde le contenu des règles. Le sens formel regarde le texte adopté selon une procédure spéciale.

Q: Qu’est-ce qu’une Constitution rigide ?
A) Une Constitution dont la révision suit une procédure plus difficile que celle des lois ordinaires
B) Une Constitution qui ne peut jamais être modifiée
C) Une Constitution non écrite
D) Une Constitution imposée par un autre État
R: A
E: Rigide ne veut pas dire immuable : la révision reste possible, mais selon une procédure renforcée.

Q: Quel est le rôle du pouvoir constituant originaire ?
A) Réviser la Constitution selon la procédure qu’elle prévoit
B) Établir une nouvelle Constitution
C) Juger les litiges entre particuliers
D) Appliquer les lois au quotidien
R: B
E: Le pouvoir constituant originaire crée une Constitution (par exemple à l’indépendance). Le pouvoir constituant dérivé la révise.

Q: Quel auteur est associé à la théorie de la séparation des pouvoirs ?
A) Montesquieu
B) Karl Marx
C) Jean-Jacques Rousseau
D) Thomas Hobbes
R: A
E: Montesquieu l’a exposée dans « De l’esprit des lois » (1748).

Q: Quelle est la fonction principale du pouvoir législatif ?
A) Voter les lois
B) Exécuter les lois
C) Commander les armées
D) Juger les litiges
R: A
E: Le Parlement vote les lois. L’exécutif les applique et le judiciaire tranche les litiges.

Q: Quelle est la caractéristique essentielle du régime parlementaire ?
A) Le président et le Parlement sont totalement indépendants
B) Les juges sont élus par le peuple
C) Le gouvernement est politiquement responsable devant le Parlement
D) Il n’y a pas de Parlement
R: C
E: Dans un régime parlementaire, le Parlement peut renverser le gouvernement, et l’exécutif peut souvent dissoudre l’assemblée.

Q: Quel pays est l’exemple type du régime présidentiel ?
A) Le Royaume-Uni
B) Les États-Unis
C) L’Allemagne
D) L’Italie
R: B
E: Le régime présidentiel repose sur une séparation stricte des pouvoirs, dont les États-Unis sont le modèle.

Q: Qu’est-ce qu’une motion de censure ?
A) Une décision du président de dissoudre l’Assemblée
B) Une loi interdisant certains journaux
C) Un recours devant le Conseil constitutionnel
D) Une procédure par laquelle l’Assemblée met en cause la responsabilité du gouvernement
R: D
E: Si la motion est adoptée, le gouvernement doit démissionner.

Q: Au Sénégal, quelle institution contrôle la conformité des lois à la Constitution ?
A) Le ministère de la Justice
B) Le Conseil constitutionnel
C) La Cour des comptes
D) Le Conseil économique, social et environnemental
R: B
E: Le Conseil constitutionnel juge la constitutionnalité des lois et le contentieux des élections nationales.

Q: Qu’est-ce qu’un référendum ?
A) Un vote par lequel le peuple se prononce directement sur un texte ou une question
B) Un vote des ministres en Conseil
C) Un sondage d’opinion
D) L’élection des députés
R: A
E: Le référendum est un procédé de démocratie directe ou semi-directe.

Q: Qu’est-ce que la démocratie représentative ?
A) Le pouvoir appartient à un seul homme
B) Le pouvoir est héréditaire
C) Le peuple vote lui-même toutes les lois
D) Le peuple exerce le pouvoir par l’intermédiaire de représentants élus
R: D
E: Les citoyens élisent des représentants (députés, président) qui décident en leur nom.

Q: Que signifie le suffrage universel ?
A) Seuls les diplômés peuvent voter
B) Tous les citoyens qui remplissent les conditions légales (âge, nationalité) peuvent voter, sans condition de fortune ni d’instruction
C) Tous les habitants du monde peuvent voter
D) Seuls les propriétaires peuvent voter
R: B
E: Le suffrage universel s’oppose au suffrage censitaire (réservé à ceux qui paient un certain impôt) et capacitaire.

Q: Dans la hiérarchie des normes, quelle norme se situe au sommet en droit interne ?
A) La Constitution
B) L’arrêté ministériel
C) Le règlement intérieur d’une entreprise
D) Le décret
R: A
E: Toutes les normes inférieures (lois, décrets, arrêtés) doivent respecter la Constitution.

Q: Qu’est-ce que le bicamérisme ?
A) Un exécutif à deux têtes
B) Deux constitutions appliquées en même temps
C) Un Parlement composé de deux chambres
D) Un gouvernement composé de deux ministres
R: C
E: Exemple : en France, l’Assemblée nationale et le Sénat. Un Parlement à une seule chambre est monocaméral.

Q: Qu’est-ce que la dissolution ?
A) La suppression d’un parti politique par un juge
B) La fin d’un traité international
C) L’acte par lequel l’exécutif met fin au mandat d’une assemblée avant son terme
D) La démission collective du gouvernement
R: C
E: La dissolution est la contrepartie de la responsabilité du gouvernement devant le Parlement.

Q: Selon la théorie de la souveraineté populaire (Rousseau), à qui appartient la souveraineté ?
A) À la Nation, entité abstraite distincte des citoyens
B) Au chef de l’État seul
C) Aux juges
D) Au peuple, chaque citoyen en détenant une parcelle
R: D
E: Rousseau défend la souveraineté populaire. La souveraineté nationale (Sieyès) l’attribue à la Nation, entité abstraite.

Q: Qu’est-ce qu’une confédération ?
A) Une organisation non gouvernementale
B) Un État sans territoire
C) Un État unitaire très décentralisé
D) Une association d’États souverains liés par un traité
R: D
E: Dans une confédération, les États membres restent souverains, contrairement aux États fédérés d’une fédération.`},
{id:"droit-judiciaire",school:"droit",name:"Institutions judiciaires – Organisation de la justice",cat:"Institutions judiciaires",txt:`Q: Que garantit le principe du double degré de juridiction ?
A) Le droit d’avoir deux avocats
B) Le jugement de chaque affaire par deux juges
C) La possibilité de faire réexaminer l’affaire par une juridiction supérieure
D) Le paiement des frais de justice en deux fois
R: C
E: Une partie mécontente du premier jugement peut faire appel, en principe.

Q: Quelle juridiction examine les appels formés contre les jugements de première instance ?
A) La cour d’appel
B) Le Conseil constitutionnel
C) Le tribunal d’instance
D) La Cour des comptes
R: A
E: La cour d’appel rejuge l’affaire en fait et en droit.

Q: Quel est le rôle principal d’une juridiction de cassation ?
A) Juger les crimes les plus graves en premier ressort
B) Rejuger entièrement les faits de l’affaire
C) Vérifier que le droit a été correctement appliqué, sans rejuger les faits
D) Rédiger les lois
R: C
E: Le juge de cassation est juge du droit. Il casse la décision si la règle de droit a été mal appliquée.

Q: Au Sénégal, quelle est la juridiction suprême de l’ordre judiciaire et de l’ordre administratif ?
A) Le Conseil constitutionnel
B) Le tribunal de grande instance
C) La Cour d’appel de Dakar
D) La Cour suprême
R: D
E: Depuis 2008, la Cour suprême réunit les fonctions de cassation en matière judiciaire et administrative.

Q: Quelle juridiction statue en dernier ressort sur l’application du droit des affaires OHADA ?
A) La Cour de justice de la CEDEAO
B) La Cour pénale internationale
C) La Cour internationale de justice
D) La Cour commune de justice et d’arbitrage (CCJA)
R: D
E: La CCJA, dont le siège est à Abidjan, assure l’interprétation et l’application uniformes des Actes uniformes OHADA.

Q: Quel est le rôle des magistrats du parquet (ministère public) ?
A) Défendre l’intérêt de la société et requérir l’application de la loi
B) Trancher le litige et rendre la décision
C) Défendre l’accusé
D) Rédiger les actes notariés
R: A
E: Les magistrats du parquet poursuivent les infractions. Les magistrats du siège rendent les jugements.

Q: Quelle garantie protège en principe les magistrats du siège ?
A) Le secret défense
B) L’inamovibilité
C) Le droit de grâce
D) L’immunité parlementaire
R: B
E: Un juge du siège ne peut pas être déplacé ou révoqué arbitrairement, ce qui protège son indépendance.

Q: À quelle catégorie de magistrats appartient le procureur de la République ?
A) Au parquet
B) Au siège
C) Aux greffiers
D) Aux auxiliaires de justice
R: A
E: Le procureur dirige le parquet auprès d’un tribunal et exerce l’action publique.

Q: Dans la classification classique des infractions, quelles sont les plus graves ?
A) Les délits
B) Les contraventions
C) Les crimes
D) Les fautes civiles
R: C
E: On distingue, de la moins grave à la plus grave : contraventions, délits, crimes.

Q: Quel est le rôle d’un avocat ?
A) Rendre les jugements
B) Conseiller, assister et représenter les parties, et défendre leurs intérêts
C) Exécuter les décisions de justice par la force
D) Requérir les peines au nom de la société
R: B
E: L’avocat est un auxiliaire de justice indépendant au service de son client.

Q: Quel professionnel est chargé de signifier les actes et de faire exécuter les décisions de justice ?
A) Le notaire
B) L’huissier de justice
C) Le juge d’instruction
D) Le greffier
R: B
E: L’huissier (commissaire de justice dans certains pays) signifie les actes et procède à l’exécution forcée.

Q: Quel est le rôle principal du notaire ?
A) Donner un caractère authentique aux actes qu’il rédige
B) Défendre un accusé devant le tribunal
C) Rendre des arrêts
D) Arrêter les suspects
R: A
E: L’acte notarié est un acte authentique : il fait foi et peut être exécuté directement.
