var DEMO=[{id:"demo-compta",name:"Comptabilité générale – Chapitre 1",cat:"Comptabilité",txt:`Q: Quel principe impose d’enregistrer chaque opération au débit d’un compte et au crédit d’un autre, pour le même montant ?

R: B
E: Avec la partie double, tout débit a un crédit d’égal montant.

Q: Dans un bilan, que représente l’actif ?
A) Ce que l’entreprise possède et ce qu’on lui doit (ses emplois)
B) Ce que l’entreprise doit à ses créanciers et à ses associés
C) La différence entre les produits et les charges
D) Les ventes de l’année
R: A
E: L’actif regroupe les biens et les créances de l’entreprise. Le passif regroupe ses ressources : capitaux propres et dettes.

Q: Quelle égalité est toujours vérifiée dans un bilan ?
A) Actif = Charges + Produits
B) Passif = Résultat
C) Total de l’actif = Total du passif
D) Charges = Produits
R: C
E: Le bilan est toujours équilibré : les emplois sont financés par des ressources de même total.

Q: Une entreprise achète un véhicule de 20 000 000 et le règle par chèque bancaire. Quel est l’effet sur le total du bilan ?
A) Il augmente de 20 000 000
B) Il diminue de 20 000 000
C) Il double
D) Il ne change pas
R: D
E: Le véhicule (immobilisation) augmente et la banque diminue du même montant : le total reste identique.

Q: Une entreprise achète un véhicule de 20 000 000, à payer dans 60 jours. Quel est l’effet sur le bilan ?
A) Seul l’actif augmente
B) L’actif et le passif augmentent chacun de 20 000 000
C) Seul le passif augmente
D) Le bilan ne change pas
R: B
E: Le véhicule augmente l’actif et la dette envers le fournisseur augmente le passif.

Q: Que mesure le compte de résultat ?
A) La performance de l’entreprise sur une période, à partir des produits et des charges
B) Le patrimoine à une date donnée
C) Uniquement la trésorerie
D) Les dettes à long terme
R: A
E: Le bilan est une photo à une date donnée ; le compte de résultat est le film d’une période.

Q: Comment calcule-t-on le résultat net de l’exercice ?
A) Charges − Produits
B) Actif − Passif
C) Ventes − Stocks
D) Produits − Charges
R: D
E: Si les produits dépassent les charges, c’est un bénéfice ; dans le cas contraire, c’est une perte.

Q: Une entreprise emprunte 30 000 000 à une banque pour acheter un bâtiment. Que représente l’emprunt ?
A) Un emploi
B) Un produit
C) Une ressource
D) Une charge
R: C
E: L’emprunt est la ressource qui finance l’emploi (le bâtiment).`},
{id:"demo-marketing",name:"Fondements du marketing – Chapitre 1",cat:"Marketing",txt:`Q: Quelle définition du marketing est la plus juste ?
A) Identifier et satisfaire les besoins des clients de façon rentable
B) Faire de la publicité pour vendre plus
C) Fixer les prix les plus bas possible
D) Distribuer les produits en magasin
R: A
E: Le marketing ne se limite pas à la publicité ou à la vente : il part des besoins du client.

Q: Avoir soif est un besoin. Vouloir précisément une marque de boisson, c’est…
A) Une demande solvable
B) Un marché
C) Un désir
D) Une habitude
R: C
E: Le besoin est un manque ressenti ; le désir est la forme précise que ce besoin prend selon la culture et la personnalité.

Q: Qu’appelle-t-on la demande en marketing ?
A) Tous les besoins existants
B) Des désirs appuyés par un pouvoir d’achat
C) L’offre disponible sur le marché
D) Le nombre de concurrents
R: B
E: Sans pouvoir d’achat, un désir reste potentiel et ne devient pas une demande.

Q: Qu’est-ce qu’un marché au sens marketing ?
A) Uniquement un lieu physique de vente
B) L’ensemble des concurrents
C) Le stock d’une entreprise
D) L’ensemble des acheteurs actuels et potentiels d’un produit
R: D
E: Un marché désigne les clients, réels ou potentiels, qui ont un besoin et la capacité d’acheter.

Q: Quels sont les 4 P du marketing-mix traditionnel ?
A) Produit, Prix, Place (distribution), Promotion
B) Produit, Profit, Personnel, Publicité
C) Plan, Projet, Prix, Place
D) Prix, Public, Processus, Preuve
R: A
E: Ce sont les quatre leviers que l’entreprise combine pour agir sur son marché.

Q: Dans la pyramide de Maslow, quel besoin est le plus fondamental ?
A) L’estime
B) Les besoins physiologiques
C) L’accomplissement de soi
D) L’appartenance
R: B
E: Ordre : physiologiques, sécurité, appartenance, estime, accomplissement de soi.

Q: Lequel de ces facteurs est un facteur psychologique du comportement du consommateur ?
A) L’âge
B) La famille
C) La perception
D) La classe sociale
R: C
E: Facteurs psychologiques : motivation, perception, apprentissage, croyances et attitudes. L’âge est un facteur personnel ; la famille et la classe sociale sont des facteurs sociaux.

Q: Quelle est la première étape du processus d’achat ?
A) La décision d’achat
B) L’évaluation des solutions
C) Le comportement après l’achat
D) La reconnaissance du besoin
R: D
E: Le processus : reconnaissance du besoin, recherche d’informations, évaluation des solutions, décision d’achat, comportement après l’achat.`},
{id:"demo-droit",name:"Introduction au droit – Chapitre 1",cat:"Droit",txt:`Q: Que désigne le droit objectif ?
A) Les prérogatives dont dispose une personne
B) Les décisions d’un seul juge
C) L’ensemble des règles qui organisent la vie en société
D) Les contrats entre particuliers
R: C
E: Le droit objectif est l’ensemble des règles obligatoires ; le droit subjectif est une prérogative reconnue à une personne.

Q: Comment appelle-t-on une prérogative reconnue à une personne, comme le droit de propriété ?
A) Un droit subjectif
B) Une sanction
C) Une personne morale
D) Une source du droit
R: A
E: Les droits subjectifs découlent des règles du droit objectif.

Q: Dans la hiérarchie des normes, quelle norme se situe au sommet ?
A) Le règlement
B) L’arrêté
C) La circulaire
D) La Constitution
R: D
E: Chaque norme doit respecter celles qui lui sont supérieures.

Q: Quelle source écrite du droit est votée par le Parlement ?
A) La coutume
B) La loi
C) La jurisprudence
D) La doctrine
R: B
E: La loi est une source écrite ; la coutume est une pratique répétée considérée comme obligatoire.

Q: Que désigne la jurisprudence ?
A) L’ensemble des décisions rendues par les juridictions
B) Les écrits des professeurs de droit
C) Les usages d’une profession
D) Les traités internationaux
R: A
E: Les écrits des juristes forment la doctrine, pas la jurisprudence.

Q: Qu’est-ce qu’une personne morale ?
A) Un être humain
B) Un bien meuble
C) Un groupement doté de la personnalité juridique, comme une société
D) Un contrat
R: C
E: Une personne morale peut posséder des biens, signer des contrats et agir en justice, comme une personne physique.

Q: À quel moment, en principe, une personne physique acquiert-elle la personnalité juridique ?
A) À sa majorité
B) À sa naissance (enfant né vivant)
C) À son mariage
D) À son premier emploi
R: B
E: La personnalité juridique commence à la naissance et s’achève avec le décès.

Q: Qu’est-ce qui distingue la règle de droit d’une simple règle morale ?
A) Elle est facultative
B) Elle ne concerne que les entreprises
C) Elle n’est jamais écrite
D) Elle est assortie d’une sanction imposée par l’État
R: D
E: La règle de droit est obligatoire et son non-respect peut être sanctionné.`},
{id:"demo-management",name:"Introduction au management – Chapitre 1",cat:"Management",txt:`Q: Quelle fonction du management consiste à fixer des objectifs et à définir les moyens de les atteindre ?
A) Le contrôle
B) La planification
C) La coordination
D) Le commandement
R: B
E: Planifier, c’est prévoir : on choisit les objectifs puis les moyens.

Q: Quelle structure repose sur une seule ligne d’autorité, chaque salarié n’ayant qu’un seul chef ?
A) La structure matricielle
B) La structure divisionnelle
C) La structure hiérarchique (linéaire)
D) La structure par projet
R: C
E: Dans la structure hiérarchique, les ordres descendent du sommet vers la base par une seule voie.

Q: Dans une structure matricielle, un salarié…
A) Dépend de deux responsables à la fois (fonctionnel et projet)
B) N’a aucun responsable
C) Ne travaille jamais en équipe
D) Dépend uniquement du directeur général
R: A
E: La matrice croise une autorité par fonction et une autorité par projet.

Q: Quelle fonction de l’entreprise s’occupe du recrutement, de la formation et de la paie ?
A) La fonction production
B) La fonction commerciale
C) La fonction financière
D) La fonction ressources humaines
R: D
E: La fonction ressources humaines gère le personnel de l’entreprise.

Q: Quelle fonction transforme des ressources en biens ou en services ?
A) La fonction financière
B) La fonction production
C) La fonction commerciale
D) La fonction ressources humaines
R: B
E: La production crée les biens et services que l’entreprise vend.

Q: Quel style de direction est celui d’un dirigeant qui décide seul et impose ses ordres ?
A) Autocratique
B) Démocratique
C) Laisser-faire
D) Bureaucratique
R: A
E: Le style autocratique concentre la décision ; le style démocratique associe l’équipe aux décisions.

Q: Dans le style de direction « laisser-faire », le dirigeant…
A) Décide de tout seul
B) Contrôle chaque tâche
C) Laisse beaucoup d’autonomie et intervient peu
D) Refuse toute délégation
R: C
E: Ce style convient à des équipes expérimentées, mais peut manquer de cadre.

Q: Qui a proposé les fonctions « prévoir, organiser, commander, coordonner, contrôler » ?
A) Maslow
B) Taylor
C) Porter
D) Fayol
R: D
E: Henri Fayol décrit ces fonctions de l’administration. Taylor est associé à l’organisation scientifique du travail.`},
{id:"demo-stats",name:"Statistiques 1 – Chapitre 1",cat:"Statistiques",txt:`Q: Quelle est la moyenne de la série 2 ; 4 ; 4 ; 6 ; 9 ?
A) 4
B) 4,5
C) 5
D) 6
R: C
E: (2 + 4 + 4 + 6 + 9) ÷ 5 = 25 ÷ 5 = 5.

Q: Quelle est la médiane de la série 3 ; 7 ; 1 ; 9 ; 5 ; 11 ?
A) 5
B) 6
C) 7
D) 6,5
R: B
E: On range : 1 ; 3 ; 5 ; 7 ; 9 ; 11. Avec 6 valeurs, on prend la moyenne des deux valeurs centrales : (5 + 7) ÷ 2 = 6.

Q: Quel est le mode de la série 5 ; 3 ; 5 ; 8 ; 3 ; 5 ; 9 ?
A) 3
B) 8
C) 9
D) 5
R: D
E: Le mode est la valeur la plus fréquente : 5 apparaît 3 fois.

Q: Quelle est la variance de la série 2 ; 4 ; 4 ; 6 ; 9 (formule de la statistique descriptive, division par n) ?
A) 5,6
B) 7
C) 28
D) 5
R: A
E: Moyenne 5. Écarts au carré : 9 ; 1 ; 1 ; 1 ; 16, soit 28 au total. Variance = 28 ÷ 5 = 5,6.

Q: Une série a une variance de 16. Quel est son écart-type ?
A) 8
B) 16
C) 4
D) 256
R: C
E: L’écart-type est la racine carrée de la variance : √16 = 4.

Q: Comment définit-on la variance ?
A) Le carré de la moyenne
B) La moyenne des carrés des écarts à la moyenne
C) La somme des écarts à la moyenne
D) La différence entre la plus grande et la plus petite valeur
R: B
E: La somme des écarts à la moyenne est toujours nulle, d’où l’usage des carrés. La différence max − min est l’étendue.

Q: On ajoute 10 à chaque valeur d’une série. Que deviennent la moyenne et l’écart-type ?
A) La moyenne augmente de 10, l’écart-type ne change pas
B) La moyenne et l’écart-type augmentent de 10
C) La moyenne ne change pas, l’écart-type augmente de 10
D) La moyenne et l’écart-type sont multipliés par 10
R: A
E: Une translation déplace la série sans modifier sa dispersion.

Q: Deux séries ont la même moyenne (50). La première a un écart-type de 5, la seconde de 12. Laquelle est la plus dispersée ?
A) La première
B) Elles sont aussi dispersées
C) On ne peut pas savoir
D) La seconde
R: D
E: Plus l’écart-type est grand, plus les valeurs s’éloignent de la moyenne.`}];

info:function(){return "<button class='back' onclick='go(\"home\")'>← Retour</button><h1>Guide</h1><p class='mu'>Tout ce qu’il faut savoir pour bien utiliser l’appli.</p>"
+"<div class='cd'><b>À quoi ça sert</b><p>L’appli est vide au départ : tu y mets tes propres questions ou exercices, elle te fait réviser et te note. Rien n’est envoyé sur Internet.</p></div>"
+"<div class='cd'><b>Pour démarrer</b><p>1. Ouvre « Comment faire » et copie le prompt. 2. Colle-le dans une IA avec ton cours. 3. Importe le résultat (texte collé ou PDF). 4. Touche « Lancer ».</p></div>"
+"<div class='cd b'><b>⚠️ Tes séries peuvent disparaître</b><p>Elles sont gardées dans le navigateur de cet appareil, pas en ligne. Elles disparaissent si tu vides les données du navigateur ou si tu utilises la navigation privée, et elles ne passent pas d’un téléphone ou d’un navigateur à l’autre. Pour en garder une copie : « Exporter », « Copier la série », puis garde le texte dans un fichier ou dans un message WhatsApp à toi-même.</p></div>"
+"<div class='cd'><b>Activation</b><p>Le code d’activation ne marche que sur l’appareil pour lequel il a été généré. Si tu vides les données du navigateur ou si tu changes de téléphone, demande un nouveau code.</p></div>"
+"<div class='cd'><b>Partager une série</b><p>« Exporter », « Copier la série », puis envoie le texte (par WhatsApp par exemple). L’autre personne le colle dans « Importer ».</p></div>"
+"<div class='cd'><b>Les modes</b><p>QCM libre : la correction s’affiche après chaque réponse. Examen : tu choisis la durée, la correction vient à la fin, tu peux changer de réponse, et il se termine tout seul quand le temps est écoulé. Erreurs : seulement les questions ratées la dernière fois. Exercices : tu fais l’exercice sur papier, tu affiches le corrigé et tu te notes.</p></div>"
+"<div class='cd'><b>Exercices et réponses chiffrées</b><p>Quand la question attend un nombre, tape-le (virgule ou point) : l’appli accepte une petite marge d’arrondi. Les tableaux écrits avec le symbole | (une ligne par ligne du tableau) s’affichent en vrai tableau. Pour les graphiques, note-toi toi-même avec le corrigé.</p></div>"
+"<div class='cd'><b>Reprendre plus tard</b><p>« Quitter et reprendre plus tard » garde ta progression : touche « Reprendre » sur l’accueil. Il n’y a qu’une session en cours à la fois : en lancer une nouvelle remplace l’ancienne. Dans un examen, le chrono continue même si tu quittes.</p></div>"
+"<div class='cd'><b>Hors ligne et installation</b><p>Après une première ouverture avec Internet, ScoreUp s’enregistre sur ton appareil et peut s’ouvrir sans connexion. Seule la lecture d’un PDF demande Internet. Pour l’avoir comme une appli : sur Android, menu du navigateur puis « Installer l’application » ; sur iPhone, bouton Partager puis « Sur l’écran d’accueil ».</p></div><div class='cd'><b>Séries d’exemple</b><p>5 séries de révision (chapitre 1) sont fournies pour tester ScoreUp : comptabilité, marketing, droit, management et statistiques. Tu peux les supprimer, et ce bouton te les redonne.</p><button class='btn s' onclick='ad(this)'>Ajouter les séries d’exemple</button></div><div class='cd'><b>Nouveautés</b><p>Matières avec couleurs (à l’import, ou depuis la liste), statistiques globales et par matière, série de jours de révision, flashcards (touche la carte pour voir la réponse) et mode sombre ou clair en haut de l’accueil, favoris (étoile), sauvegarde complète et mode transport (boutons de navigation en bas).</p></div>"
+"<div class='cd'><b>Import</b><p>L’appli vérifie le format et indique la ligne à corriger. Les doublons sont ignorés. Un PDF doit contenir du vrai texte : une photo ou un scan ne marche pas. Les questions et les choix sont mélangés si la case est cochée, donc la lettre de la bonne réponse change d’un essai à l’autre.</p></div>"
+"<div class='cd'><b>Fiabilité</b><p>Une IA peut se tromper. Vérifie les réponses et les corrigés, surtout les calculs, avec ton cours ou ton prof avant de t’y fier ou de les partager. Demande aussi l’accord de ton prof avant de partager ses fiches.</p></div>"
+"<div class='cd'><b>Bon à savoir</b><p>Supprimer une série demande deux touches, pour éviter les erreurs. L’historique garde tes 100 derniers résultats.</p></div>"},

/* ---------- QR code : générateur intégré (hors ligne) + lecteur caméra ---------- */
const QR=(()=>{
  const ECC={L:[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],M:[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]};
  const BLK={L:[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]};
  const FMT={L:1,M:0};
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const rawModules=v=>{let r=(16*v+128)*v+64;if(v>=2){const na=Math.floor(v/7)+2;r-=(25*na-10)*na-55;if(v>=7)r-=36}return r};
  const dataCw=(v,e)=>Math.floor(rawModules(v)/8)-ECC[e][v]*BLK[e][v];
  const alignPos=v=>{if(v===1)return [];const na=Math.floor(v/7)+2,size=v*4+17,step=v===32?26:Math.ceil((v*4+4)/(na*2-2))*2,r=[6];for(let p=size-7;r.length<na;p-=step)r.splice(1,0,p);return r};
  const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rsRem=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
  const MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  function penalty(M,n){let p=0,dark=0;
    for(let a=0;a<n;a++){let rr=1,rc=1;for(let b=1;b<=n;b++){if(b<n&&M[a][b]===M[a][b-1])rr++;else{if(rr>=5)p+=rr-2;rr=1}if(b<n&&M[b][a]===M[b-1][a])rc++;else{if(rc>=5)p+=rc-2;rc=1}}}
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(M[y][x])dark++;if(y<n-1&&x<n-1){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}}
    return p+Math.max(0,Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10}
  function encode(text,e){e=e||'L';const bytes=Array.from(new TextEncoder().encode(text));let v=1,cap=0;
    for(;v<=40;v++){cap=dataCw(v,e)*8;if(4+(v<10?8:16)+bytes.length*8<=cap)break}
    if(v>40)throw new Error('Données trop longues pour un QR code');
    const bits=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    const nb=BLK[e][v],el=ECC[e][v],raw=Math.floor(rawModules(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-el+(i<nShort?0:1));k+=dat.length;const ec=rsRem(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(ec))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-el||j>=nShort)all.push(b[i])});
    const size=v*4+17,M=Array.from({length:size},()=>new Array(size).fill(false)),F=Array.from({length:size},()=>new Array(size).fill(false));
    const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
    [[3,3],[size-4,3],[3,size-4]].forEach(([cx,cy])=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const xx=cx+dx,yy=cy+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size){const d=Math.max(Math.abs(dx),Math.abs(dy));setF(xx,yy,d!==2&&d!==4)}}});
    const ap=alignPos(v),na=ap.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    const drawFmt=m=>{const d=FMT[e]<<3|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)setF(8,i,g(i));setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));for(let i=9;i<15;i++)setF(14-i,8,g(i));
      for(let i=0;i<8;i++)setF(size-1-i,8,g(i));for(let i=8;i<15;i++)setF(8,size-15+i,g(i));setF(8,size-8,true)};
    drawFmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bt=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);setF(a,c,bt);setF(c,a,bt)}}

    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&MASKS[m](x,y))M[y][x]=!M[y][x]};
    let best=0,bp=Infinity;for(let m=0;m<8;m++){apply(m);drawFmt(m);const p=penalty(M,size);if(p<bp){bp=p;best=m}apply(m)}
    apply(best);drawFmt(best);return M}
  function canvas(text,px,e){const q=encode(text,e),n=q.length,quiet=4,total=n+quiet*2,scale=Math.max(2,Math.floor((px||300)/total)),c=document.createElement('canvas');
    c.width=c.height=total*scale;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
    for(let y=0;y<n;y++)for(let xx=0;xx<n;xx++)if(q[y][xx])x.fillRect((xx+quiet)*scale,(y+quiet)*scale,scale,scale);c.className='qr';return c}
  return {encode,canvas};
})();

let scanStream=null,scanTimer=null;
function loadJsQR(){return new Promise((ok,ko)=>{if(window.jsQR)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=()=>window.jsQR?ok():ko();s.onerror=ko;document.head.appendChild(s)})}
async function startScan(video,status,onText){
  stopScan();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='📵 Caméra non disponible ici. Ouvre l\'appli installée (site en https).';return}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){status.textContent='📵 Accès à la caméra refusé. Autorise-le dans les réglages du navigateur.';return}
  video.setAttribute('playsinline','');video.muted=true;video.srcObject=scanStream;try{await video.play()}catch(e){}
  let detect=null;
  if('BarcodeDetector' in window){try{const bd=new BarcodeDetector({formats:['qr_code']});detect=async()=>{const r=await bd.detect(video);return r.length?r[0].rawValue:null}}catch(e){detect=null}}
  if(!detect){status.textContent='Chargement du lecteur…';try{await loadJsQR()}catch(e){status.textContent='❌ Lecteur QR indisponible hors ligne sur ce téléphone. Utilise le message ou le fichier.';stopScan();return}
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    detect=async()=>{const w=video.videoWidth,h=video.videoHeight;if(!w)return null;const s=Math.min(1,720/Math.max(w,h));cv.width=w*s|0;cv.height=h*s|0;cx.drawImage(video,0,0,cv.width,cv.height);const r=window.jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});return r?r.data:null}}
  if(!scanStream)return;
  status.textContent='🎯 Vise le QR code…';
  let busy=false;scanTimer=setInterval(async()=>{if(busy||!scanStream)return;busy=true;try{const t=await detect();if(t)onText(t)}catch(e){}busy=false},160);
}
function stopScan(){clearInterval(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
